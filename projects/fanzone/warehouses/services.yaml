---
# All fanzone services live under asia-south1-docker.pkg.dev/tesseracthub-480811/ghcr-remote/tesserix/fanzone-battle-ground/.
# A single Warehouse with one image subscription per service emits a
# Freight whenever ANY service publishes a new `main-<sha>` tag, with
# the latest known references for ALL services included. The prod
# Stage promotes them in lock-step.
#
# `latest` and `buildcache` tags are deliberately excluded by the
# `allowTags` regex — only `main-<7-or-8-hex>` is promotable.
apiVersion: kargo.akuity.io/v1alpha1
kind: Warehouse
metadata:
  name: services
spec:
  freightCreationPolicy: Automatic
  interval: 300s
  subscriptions:
    - image:
        repoURL: asia-south1-docker.pkg.dev/tesseracthub-480811/ghcr-remote/tesserix/fanzone-battle-ground/fanzone-api
        imageSelectionStrategy: NewestBuild
        allowTags: '^main-[a-f0-9]{7,12}$'
        strictSemvers: false
        platform: linux/amd64
        discoveryLimit: 5
    - image:
        repoURL: asia-south1-docker.pkg.dev/tesseracthub-480811/ghcr-remote/tesserix/fanzone-battle-ground/fanzone-auth
        imageSelectionStrategy: NewestBuild
        allowTags: '^main-[a-f0-9]{7,12}$'
        strictSemvers: false
        platform: linux/amd64
        discoveryLimit: 5
