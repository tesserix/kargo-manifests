---
# Kargo enforces: Project.metadata.name == namespace name. So the
# Project is called `kargo-fanzone` to match the kargo-fanzone
# namespace pre-created here. The label on the namespace must
# also match the project name for Kargo to adopt it.
apiVersion: v1
kind: Namespace
metadata:
  name: kargo-fanzone
  labels:
    app.kubernetes.io/part-of: tesseract-platform
    app.kubernetes.io/component: release
    # Per Kargo source (api/v1alpha1/labels.go LabelValueTrue), this
    # label's value MUST be the literal string "true", not the project
    # name. Kargo's project admission webhook reads it as a boolean
    # marker — "this namespace is already a Project namespace, fine to
    # adopt".
    kargo.akuity.io/project: "true"
---
# Cluster-scoped Project marker. No spec in Kargo 1.9 — promotion
# policies live in a sibling ProjectConfig CRD.
apiVersion: kargo.akuity.io/v1alpha1
kind: Project
metadata:
  name: kargo-fanzone
  annotations:
    kargo.akuity.io/description: |
      FanZone Battle Ground (fanzonebattleground.com).
      One-env (prod) deploy: Kargo discovers new main-<sha> tags pushed
      to ghcr.io/tesserix/fanzone-battle-ground/* and patches the
      corresponding Argo CD Applications' helm.parameters.image.tag.
---
# Project-level config (Kargo 1.9). Lives in the project namespace and
# shares the project's name.
apiVersion: kargo.akuity.io/v1alpha1
kind: ProjectConfig
metadata:
  name: kargo-fanzone
  namespace: kargo-fanzone
spec:
  promotionPolicies:
    - stage: prod
      autoPromotionEnabled: true
