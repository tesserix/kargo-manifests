---
# Single prod Stage — auto-promotes (see Project's promotionPolicies)
# Freight from the bundled Warehouse onto every fanzone Argo CD
# Application. Each Application is annotated with
#   kargo.akuity.io/authorized-stage: fanzone:prod
# without which Kargo refuses to mutate it.
#
# Each `argocd-update` step writes the new `image.tag` value into the
# named Application's spec.source.helm.parameters list. Argo CD's
# automated sync then rolls the Knative service to the new revision.
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: prod
  annotations:
    kargo.akuity.io/color: '#EE4E4E'
spec:
  requestedFreight:
    - origin:
        kind: Warehouse
        name: services
      sources:
        direct: true
  promotionTemplate:
    spec:
      vars:
        - name: argocdRepo
          value: https://github.com/tesserix/tesserix-k8s.git
        - name: ghcrPrefix
          value: ghcr.io/tesserix/fanzone-battle-ground

      steps:
        # ----- fanzone-api -----
        - uses: argocd-update
          config:
            apps:
              - name: fanzone-api
                namespace: argocd
                sources:
                  - repoURL: ${{ vars.argocdRepo }}
                    helm:
                      images:
                        - key: image.tag
                          value: ${{ imageFrom(vars.ghcrPrefix + "/fanzone-api").Tag }}

        # ----- fanzone-auth -----
        - uses: argocd-update
          config:
            apps:
              - name: fanzone-auth
                namespace: argocd
                sources:
                  - repoURL: ${{ vars.argocdRepo }}
                    helm:
                      images:
                        - key: image.tag
                          value: ${{ imageFrom(vars.ghcrPrefix + "/fanzone-auth").Tag }}

        # ----- fanzone-auth-bff -----
