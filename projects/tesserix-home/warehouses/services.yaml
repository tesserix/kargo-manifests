---
# Two images, one repo. The tesserix-home monorepo builds and pushes both
# the Next.js web app (deployed as Deployment/company, tesserix.app) and
# the operator console (Deployment/console, console.tesserix.app) from the
# same CI run on every merge to main.
#
# Manifest type: single-arch Docker v2 for BOTH (CI builds each with
# `docker build --platform linux/amd64` and pushes `main-<sha7>` +
# `latest`), so the `platform:` filter is intentionally OMITTED —
# including it would silently drop every tag (Phase-1 retrospective
# gotcha #10), exactly as for tesserix-blog.
apiVersion: kargo.akuity.io/v1alpha1
kind: Warehouse
metadata:
  name: services
spec:
  freightCreationPolicy: Automatic
  interval: 300s
  subscriptions:
    - image:
        repoURL: asia-south1-docker.pkg.dev/tesseracthub-480811/ghcr-remote/tesserix/tesserix-home
        imageSelectionStrategy: NewestBuild
        allowTagsRegexes:
          - '^main-[a-f0-9]{7,12}$'
        strictSemvers: false
        discoveryLimit: 5
    # Operator console (apps/console). Same shape as the subscription above
    # on purpose: no `platform:` filter, and allowTagsRegexes pinned to the
    # `main-<sha7>` form CI produces — `latest` is deliberately excluded so a
    # Freight always names an immutable tag.
    #
    # MERGE ORDER MATTERS — TWO PRECONDITIONS, BOTH OF THEM ONE-WAY.
    # Getting either wrong stops `company` (tesserix.app) being promoted,
    # not just the console.
    #
    #   1. THE IMAGE MUST EXIST. A Warehouse produces Freight only once it
    #      can discover an artifact for EVERY subscription. Until
    #      tesserix-home CI has pushed at least one
    #      `tesserix-console:main-<sha7>` to the GAR mirror, this warehouse
    #      discovers nothing at all and no Freight is created — so the web
    #      image stops flowing too.
    #
    #   2. THE `console` ARGO CD APPLICATION MUST ALREADY EXIST AND HAVE
    #      SYNCED. The `argocd-update` step in ../stages/prod.yaml now names
    #      two Applications, and that step ERRORS if a named Application is
    #      absent — a failed Promotion blocks every other app in the same
    #      step. This is not hypothetical: see commit 691d092, where
    #      kargo-support-platform:prod errored for five days on "unable to
    #      find Argo CD Application fanzone-mcp" (decommissioned) and
    #      blocked the image rollout for every other tenant.
    #
    # Required order, and this file is the LAST of the four:
    #   tesserix-home console PR merged
    #     -> its CI pushes tesserix-console:main-<sha7>
    #     -> tesserix-k8s console PR merged AND the `console` Application
    #        synced in Argo CD
    #     -> this PR.
    - image:
        repoURL: asia-south1-docker.pkg.dev/tesseracthub-480811/ghcr-remote/tesserix/tesserix-console
        imageSelectionStrategy: NewestBuild
        allowTagsRegexes:
          - '^main-[a-f0-9]{7,12}$'
        strictSemvers: false
        discoveryLimit: 5
    # NOTE: image-only warehouse (same as kargo-homechef). A `git:`
    # subscription on tesserix-k8s for config-change tracking is
    # DISABLED because the shared `external-secrets-resources` ArgoCD
    # app (path external-secrets/prod) is currently failing its
    # kustomize build, so the `tesserix-k8s-git-creds` ExternalSecret
    # can't materialise in this namespace — and a git sub without creds
    # makes the WHOLE warehouse Ready=False (blocking image discovery
    # too). Restore the block below once that app syncs cleanly and the
    # secret exists.
    # - git:
    #     repoURL: https://github.com/tesserix/tesserix-k8s.git
    #     branch: main
    #     includePaths:
    #       - charts/apps/company/.*
    #       - argocd/prod/apps/global/company\.yaml
