---
# HomeChef promotes via the GIT COMMIT GRAPH, not image-tag discovery.
#
# Why: NewestBuild/Lexical/Digest all rank the registry tag list, but the
# homechef-* repos have >100 `main-<sha>` tags. Artifact Registry paginates
# the tag list at 100 in arbitrary order, so the newest `main-<sha>` lands on
# a later page — outside Kargo's discoveryLimit — and NewestBuild silently
# promotes the newest of a STALE page, flapping prod backwards. Observed
# 2026-06-20: homechef-api flapped main-2246189 -> main-702c363 (an older
# image whose layer lacks the temporal `worker` binary), the worker
# CrashLoopBackOff'd, homechef-api went Degraded, the prod Stage errored at
# step-1, and homechef-auth-bff therefore never advanced past main-741790f
# (pre-/api/v1-proxy) -> admin portal 404'd every /bff/api/v1/admin/* call.
# Same class of bug devai/stockpilot/scrapper hit; the fix is identical:
# subscribe to the commit graph (true order, no pagination) and DERIVE
# image.tag = main-<sha7> in the prod Stage.
#
# CI is path-filtered (only changed services rebuild), so the
# `homechef-ensure-image-tags` workflow in tesserix/Home-Chef-App guarantees
# every service image carries a `main-<sha>` tag for each promoted commit
# (it carries unchanged / non-built services forward from their currently
# deployed tag), THEN fast-forwards the `deploy` branch. Kargo watches
# `deploy` (NOT `main`) so a commit is only promotable once all six images
# are pullable — this avoids the GAR pull-through mirror negative-caching a
# 404 for a not-yet-pushed tag (the devai race incident).
#
# Images are still PULLED from the GAR mirror (image.repository in each
# chart's values is unchanged); only the tag SOURCE moved to git. The git
# read credential is the `home-chef-app-git-creds` Secret (cred-type=git,
# scoped to this repo) provisioned via External Secrets in tesserix-k8s.
apiVersion: kargo.akuity.io/v1alpha1
kind: Warehouse
metadata:
  name: services
spec:
  freightCreationPolicy: Automatic
  # Kargo normalizes durations to Go canonical form (300s -> 5m0s); use the
  # normalized form so the Warehouse doesn't read perpetually OutOfSync.
  interval: 5m0s
  subscriptions:
    # Authoritative trigger: every commit fast-forwarded onto the `deploy`
    # branch becomes a Freight. The prod Stage derives
    # image.tag = main-<commit sha7> for all six monorepo images
    # (api, web, admin-portal, vendor-portal, delivery-portal, auth-bff).
    # Commit-graph order is immune to the registry tag-list pagination that
    # broke image discovery. `deploy` is advanced by ensure-image-tags only
    # after every image's main-<sha> tag exists.
    - git:
        repoURL: https://github.com/tesserix/Home-Chef-App.git
        branch: deploy
        commitSelectionStrategy: NewestFromBranch
        discoveryLimit: 20
