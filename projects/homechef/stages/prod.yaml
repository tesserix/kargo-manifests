---
# Single prod Stage — auto-promotes Freight from the bundled Warehouse
# straight onto every HomeChef Argo CD Application, in lock-step.
#
# Each Argo CD Application has annotation
#   kargo.akuity.io/authorized-stage: kargo-homechef:prod
# without which Kargo refuses to mutate it.
#
# The `argocd-update` step writes the new `image.tag` value into each
# Application's spec.source.helm.parameters list. ArgoCD's automated
# sync then rolls the Knative service / Deployment.
#
# `imageFrom("<repoURL>")` pulls the matching image entry from the
# current Freight; `.Tag` returns the discovered tag (e.g.
# "main-4eb62b7").
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: prod
  annotations:
    kargo.akuity.io/color: '#FF6B35'
spec:
  requestedFreight:
    - origin:
        kind: Warehouse
        name: services
      sources:
        direct: true
  promotionTemplate:
    spec:
      vars:
        - name: argocdRepo
          value: https://github.com/tesserix/tesserix-k8s.git

      steps:
        # ----- homechef-api -----
        - uses: argocd-update
          config:
            apps:
              - name: homechef-api
                namespace: argocd
                sources:
                  - repoURL: ${{ vars.argocdRepo }}
                    helm:
                      images:
                        - key: image.tag
                          value: ${{ imageFrom("asia-south1-docker.pkg.dev/tesseracthub-480811/ghcr-remote/tesserix/home-chef-app/homechef-api").Tag }}

        # ----- homechef-web -----
        - uses: argocd-update
          config:
            apps:
              - name: homechef-web
                namespace: argocd
                sources:
                  - repoURL: ${{ vars.argocdRepo }}
                    helm:
                      images:
                        - key: image.tag
                          value: ${{ imageFrom("asia-south1-docker.pkg.dev/tesseracthub-480811/ghcr-remote/tesserix/home-chef-app/homechef-web").Tag }}

        # ----- homechef-admin-portal -----
        - uses: argocd-update
          config:
            apps:
              - name: homechef-admin-portal
                namespace: argocd
                sources:
                  - repoURL: ${{ vars.argocdRepo }}
                    helm:
                      images:
                        - key: image.tag
                          value: ${{ imageFrom("asia-south1-docker.pkg.dev/tesseracthub-480811/ghcr-remote/tesserix/home-chef-app/homechef-admin-portal").Tag }}

        # ----- homechef-vendor-portal -----
        - uses: argocd-update
          config:
            apps:
              - name: homechef-vendor-portal
                namespace: argocd
                sources:
                  - repoURL: ${{ vars.argocdRepo }}
                    helm:
                      images:
                        - key: image.tag
                          value: ${{ imageFrom("asia-south1-docker.pkg.dev/tesseracthub-480811/ghcr-remote/tesserix/home-chef-app/homechef-vendor-portal").Tag }}

        # ----- homechef-delivery-portal -----
        - uses: argocd-update
          config:
            apps:
              - name: homechef-delivery-portal
                namespace: argocd
                sources:
                  - repoURL: ${{ vars.argocdRepo }}
                    helm:
                      images:
                        - key: image.tag
                          value: ${{ imageFrom("asia-south1-docker.pkg.dev/tesseracthub-480811/ghcr-remote/tesserix/home-chef-app/homechef-delivery-portal").Tag }}

        # ----- homechef-auth-bff -----
        - uses: argocd-update
          config:
            apps:
              - name: homechef-auth-bff
                namespace: argocd
                sources:
                  - repoURL: ${{ vars.argocdRepo }}
                    helm:
                      images:
                        - key: image.tag
                          value: ${{ imageFrom("asia-south1-docker.pkg.dev/tesseracthub-480811/ghcr-remote/tesserix/home-chef-app/homechef-auth-bff").Tag }}
