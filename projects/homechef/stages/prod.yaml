---
# Single prod Stage — auto-promotes Freight from the bundled Warehouse
# straight onto every HomeChef Argo CD Application, in lock-step.
#
# Each Argo CD Application has annotation
#   kargo.akuity.io/authorized-stage: kargo-homechef:prod
# without which Kargo refuses to mutate it.
#
# The `argocd-update` step writes the new `image.tag` value into each
# Application's spec.source.helm.parameters list. ArgoCD's automated
# sync then rolls the Knative service / Deployment.
#
# image.tag is DERIVED from the source repo's promoted commit (NOT
# imageFrom), because the GAR/ghcr tag list paginates at 100 and broke
# NewestBuild image discovery (see the warehouse for the incident note).
# CI tags every changed service `main-<sha7>` and `ensure-image-tags`
# carries unchanged services forward to the same `main-<sha7>`, so resolving
# the tag from the commit ID yields the right image for ALL six services
# without the broken registry-tag discovery. Images are still PULLED from
# GAR (image.repository in each chart's values is the GAR mirror); only the
# tag SOURCE changed.
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: prod
  annotations:
    kargo.akuity.io/color: '#FF6B35'
spec:
  requestedFreight:
    - origin:
        kind: Warehouse
        name: services
      sources:
        direct: true
  promotionTemplate:
    spec:
      vars:
        - name: argocdRepo
          value: https://github.com/tesserix/tesserix-k8s.git
        # main-<sha7> from the tesserix/Home-Chef-App commit promoted onto
        # the `deploy` branch — drives all six monorepo images.
        - name: imageTag
          value: main-${{ commitFrom("https://github.com/tesserix/Home-Chef-App.git").ID[0:7] }}

      steps:
        # ----- homechef-api -----
        - uses: argocd-update
          config:
            apps:
              - name: homechef-api
                namespace: argocd
                sources:
                  - repoURL: ${{ vars.argocdRepo }}
                    helm:
                      images:
                        - key: image.tag
                          value: ${{ vars.imageTag }}

        # ----- homechef-web -----
        - uses: argocd-update
          config:
            apps:
              - name: homechef-web
                namespace: argocd
                sources:
                  - repoURL: ${{ vars.argocdRepo }}
                    helm:
                      images:
                        - key: image.tag
                          value: ${{ vars.imageTag }}

        # ----- homechef-vendor-portal -----
        - uses: argocd-update
          config:
            apps:
              - name: homechef-vendor-portal
                namespace: argocd
                sources:
                  - repoURL: ${{ vars.argocdRepo }}
                    helm:
                      images:
                        - key: image.tag
                          value: ${{ vars.imageTag }}

        # ----- homechef-auth-bff -----
        - uses: argocd-update
          config:
            apps:
              - name: homechef-auth-bff
                namespace: argocd
                sources:
                  - repoURL: ${{ vars.argocdRepo }}
                    helm:
                      images:
                        - key: image.tag
                          value: ${{ vars.imageTag }}
