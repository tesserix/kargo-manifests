---
# Auto-promotes the newest civiclens-api image by digest onto the civiclens-api Application (authorized-stage kargo-civiclens:prod).
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: prod
  annotations:
    kargo.akuity.io/color: '#1F6FEB'
spec:
  requestedFreight:
    - origin:
        kind: Warehouse
        name: services
      sources:
        direct: true
  promotionTemplate:
    spec:
      vars:
        - name: argocdRepo
          value: https://github.com/tesserix/tesserix-k8s.git
        - name: imageRepo
          value: asia-south1-docker.pkg.dev/tesseracthub-480811/global/civiclens-api

      steps:
        - uses: argocd-update
          config:
            apps:
              - name: civiclens-api
                namespace: argocd
                sources:
                  - repoURL: ${{ vars.argocdRepo }}
                    helm:
                      images:
                        - key: image.repository
                          value: ${{ vars.imageRepo }}
                        - key: image.tag
                          value: ${{ imageFrom(vars.imageRepo).Tag }}
                        # The chart prefers the digest, so it must move with the tag.
                        - key: image.digest
                          value: ${{ imageFrom(vars.imageRepo).Digest }}
