apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: sandbox
spec:
  requestedFreight:
    - origin:
        kind: Warehouse
        name: ocr-service
      sources:
        direct: true
  promotionTemplate:
    spec:
      vars:
        - name: tag
          value: ${{ commitFrom("https://github.com/tesserix/document-intelligence.git").ID }}
      steps:
        - uses: argocd-update
          config:
            apps:
              - name: document-intelligence-sandbox
                namespace: argocd
                sources:
                  - repoURL: https://github.com/tesserix/tesserix-k8s.git
                    helm:
                      images:
                        - key: image.tag
                          value: ${{ vars.tag }}
