apiVersion: v1
kind: Namespace
metadata:
  name: kargo-document-intelligence
  labels:
    app.kubernetes.io/part-of: tesseract-platform
    app.kubernetes.io/component: release
    kargo.akuity.io/project: "true"
---
apiVersion: kargo.akuity.io/v1alpha1
kind: Project
metadata:
  name: kargo-document-intelligence
  annotations:
    kargo.akuity.io/description: Reusable OCR service with sandbox then production promotion.
---
apiVersion: kargo.akuity.io/v1alpha1
kind: ProjectConfig
metadata:
  name: kargo-document-intelligence
  namespace: kargo-document-intelligence
spec:
  promotionPolicies:
    - stage: sandbox
      autoPromotionEnabled: false
    - stage: prod
      autoPromotionEnabled: false
