---
# Kargo enforces: Project.metadata.name == namespace name. So the
# Project is called `kargo-planning-poker` to match the
# kargo-planning-poker namespace pre-created here.
apiVersion: v1
kind: Namespace
metadata:
  name: kargo-planning-poker
  labels:
    app.kubernetes.io/part-of: tesseract-platform
    app.kubernetes.io/component: release
    # Per Kargo source (api/v1alpha1/labels.go LabelValueTrue), this
    # label's value MUST be the literal string "true", not the project
    # name.
    kargo.akuity.io/project: "true"
---
apiVersion: kargo.akuity.io/v1alpha1
kind: Project
metadata:
  name: kargo-planning-poker
  annotations:
    kargo.akuity.io/description: |
      Planning Poker — real-time sprint estimation at
      planningpoker.tesserix.app. Two images (api, web) built from the
      tesserix/planning-poker repo. One-env (prod) deploy: both tags land
      on the single `planning-poker` Argo CD Application, which serves
      both Deployments from one chart. NATS (charts/apps/nats) is a
      third-party image with no build pipeline and is out of scope.
---
apiVersion: kargo.akuity.io/v1alpha1
kind: ProjectConfig
metadata:
  name: kargo-planning-poker
  namespace: kargo-planning-poker
spec:
  promotionPolicies:
    - stage: prod
      autoPromotionEnabled: true
