---
apiVersion: v1
kind: Namespace
metadata:
  name: kargo-zitadel-operator
  labels:
    app.kubernetes.io/part-of: tesseract-platform
    app.kubernetes.io/component: release
    kargo.akuity.io/project: "true"
---
apiVersion: kargo.akuity.io/v1alpha1
kind: Project
metadata:
  name: kargo-zitadel-operator
  annotations:
    kargo.akuity.io/description: |
      Automatically promotes immutable Zitadel onboarding operator images to
      the production identity-operator namespace through GitOps.
---
apiVersion: kargo.akuity.io/v1alpha1
kind: ProjectConfig
metadata:
  name: kargo-zitadel-operator
  namespace: kargo-zitadel-operator
spec:
  promotionPolicies:
    - stage: prod
      autoPromotionEnabled: true
