---
# Promotions propose the immutable freight digest through a pull request.
# Argo CD converges only after protected-main review and checks have completed.
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: prod
  annotations:
    kargo.akuity.io/color: '#2E7D32'
spec:
  requestedFreight:
    - origin:
        kind: Warehouse
        name: services
      sources:
        direct: true
  promotionTemplate:
    spec:
      vars:
        - name: targetRepo
          value: https://github.com/tesserix/tesserix-k8s.git
        - name: imageRepo
          value: asia-south1-docker.pkg.dev/tesseracthub-480811/ghcr-remote/tesserix/zitadel-operator
        - name: sourceImageName
          value: ghcr.io/tesserix/zitadel-operator
      steps:
        - uses: git-clone
          as: clone
          config:
            repoURL: ${{ vars.targetRepo }}
            checkout:
              - branch: main
                path: ./repo

        - uses: kustomize-set-image
          config:
            path: ./repo/k8s/operators/zitadel
            images:
              - image: ${{ vars.sourceImageName }}
                newName: ${{ vars.imageRepo }}
                digest: ${{ imageFrom(vars.imageRepo).Digest }}

        - uses: git-commit
          as: commit
          config:
            path: ./repo
            message: "chore(zitadel-operator): kargo promote current freight"

        - uses: git-push
          if: ${{ outputs.commit.commit != outputs.clone.commits['./repo'] }}
          as: push
          config:
            path: ./repo
            generateTargetBranch: true

        - uses: git-open-pr
          if: ${{ outputs.commit.commit != outputs.clone.commits['./repo'] }}
          as: open-pr
          config:
            repoURL: ${{ vars.targetRepo }}
            sourceBranch: ${{ outputs.push.branch }}
            targetBranch: main
            title: "chore(identity): promote reviewed operator digest"
            description: >-
              Pin the immutable operator digest from Kargo freight.
              Merge only after repository checks and review; Kargo waits for
              the merge before verifying the Argo CD rollout.

        - uses: git-wait-for-pr
          if: ${{ outputs.commit.commit != outputs.clone.commits['./repo'] }}
          as: wait-for-pr
          retry:
            timeout: 24h
          config:
            repoURL: ${{ vars.targetRepo }}
            prNumber: ${{ outputs['open-pr'].pr.id }}

        - uses: argocd-update
          retry:
            timeout: 30m
            errorThreshold: 3
          config:
            apps:
              - name: zitadel-operator
                namespace: argocd
                sources:
                  - repoURL: ${{ vars.targetRepo }}
                    desiredRevision: "${{ outputs.commit.commit == outputs.clone.commits['./repo'] ? outputs.commit.commit : outputs['wait-for-pr'].commit }}"
