---
# Two image subscriptions (otto, slm-router) — both built by the
# slm-support-platform repo's CI on every push to main, tagged
# `main-<sha>`.
#
# Both image subscriptions are multi-arch OCI image indexes, so
# `platform: linux/amd64` is REQUIRED.
#
# NOTE — git subscription temporarily removed: the cluster-wide
# tesserix-k8s-git-creds setup for Kargo is incomplete (per
# project_kargo_phase2_status memory, "git subscription on tesserix-k8s
# reverted pending GitHub credential setup"). With a git subscription
# present and empty, Kargo can't form Freight (all subscriptions must
# yield artifacts). Restore the `git:` subscription below once the
# cluster-wide GitHub credential setup lands. Chart-only changes in
# tesserix-k8s still deploy automatically via ArgoCD's own git polling
# — only the audit/promotion-trail aspect is missed.
apiVersion: kargo.akuity.io/v1alpha1
kind: Warehouse
metadata:
  name: services
spec:
  freightCreationPolicy: Automatic
  interval: 300s
  subscriptions:
    - image:
        repoURL: asia-south1-docker.pkg.dev/tesseracthub-480811/ghcr-remote/tesserix/slm-support-platform/otto
        imageSelectionStrategy: NewestBuild
        allowTags: '^main-[a-f0-9]{7,12}$'
        strictSemvers: false
        platform: linux/amd64
        discoveryLimit: 5
    - image:
        repoURL: asia-south1-docker.pkg.dev/tesseracthub-480811/ghcr-remote/tesserix/slm-support-platform/slm-router
        imageSelectionStrategy: NewestBuild
        allowTags: '^main-[a-f0-9]{7,12}$'
        strictSemvers: false
        platform: linux/amd64
        discoveryLimit: 5
