---
# Single prod Stage — auto-promotes the newest main-<sha7> onto the
# beautyandcruor Argo CD Application's spec.source.helm.parameters.
#
# The Application carries
#   kargo.akuity.io/authorized-stage: kargo-beautyandcruor:prod
# without which Kargo refuses to mutate it.
#
# Both Helm keys are written from the SAME image. The sidecar has no
# subscription of its own — see the warehouse for why — and CI guarantees
# the two images always carry the same tag, so the site's tag is the
# sidecar's tag.
#
# These parameters override the chart's values.yaml, so after the first
# promotion the `tag:` fields there stop being what is deployed. They are
# left in place as the value a fresh install would use.
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: prod
  annotations:
    kargo.akuity.io/color: '#B3111D'
spec:
  requestedFreight:
    - origin:
        kind: Warehouse
        name: services
      sources:
        direct: true
  promotionTemplate:
    spec:
      vars:
        - name: argocdRepo
          value: https://github.com/tesserix/tesserix-k8s.git
        - name: registry
          value: asia-south1-docker.pkg.dev/tesseracthub-480811/ghcr-remote/tesserix

      steps:
        - uses: argocd-update
          config:
            apps:
              - name: beautyandcruor
                namespace: argocd
                sources:
                  - repoURL: ${{ vars.argocdRepo }}
                    helm:
                      images:
                        - key: image.tag
                          value: ${{ imageFrom(vars.registry + "/beautyandcruor").Tag }}
                        - key: enquiry.image.tag
                          value: ${{ imageFrom(vars.registry + "/beautyandcruor").Tag }}
