---
# Single prod Stage — auto-promotes the newest main-<sha7> onto the
# beautyandcruor Argo CD Application's spec.source.helm.parameters.
#
# The Application carries
#   kargo.akuity.io/authorized-stage: kargo-beautyandcruor:prod
# without which Kargo refuses to mutate it.
#
# Both Helm keys are derived from the SAME commit.
#
# CI builds both images from one commit and tags them main-<sha7>, so the
# commit on `deploy` names both images exactly. Nothing is read from the
# registry — see the warehouse for why image discovery cannot be trusted
# through the pull-through mirror.
#
# These parameters override the chart's values.yaml, so after the first
# promotion the `tag:` fields there stop being what is deployed. They are
# left in place as the value a fresh install would use.
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: prod
  annotations:
    kargo.akuity.io/color: '#B3111D'
spec:
  requestedFreight:
    - origin:
        kind: Warehouse
        name: services
      sources:
        direct: true
  promotionTemplate:
    spec:
      vars:
        - name: argocdRepo
          value: https://github.com/tesserix/tesserix-k8s.git
        - name: imageTag
          value: main-${{ commitFrom("https://github.com/tesserix/beautyandcruor.git").ID[0:7] }}

      steps:
        - uses: argocd-update
          config:
            apps:
              - name: beautyandcruor
                namespace: argocd
                sources:
                  - repoURL: ${{ vars.argocdRepo }}
                    helm:
                      images:
                        - key: image.tag
                          value: ${{ vars.imageTag }}
                        - key: enquiry.image.tag
                          value: ${{ vars.imageTag }}
