---
# One image subscription, two images deployed.
#
# CI builds the nginx image and the enquiry sidecar in the same job from
# the same commit, tagging both `main-<sha7>`. Subscribing to both in a
# single Warehouse means one Freight carries both tags, so the pair can
# never be promoted apart — the site and the endpoint it proxies to are
# always from the same build.
#
# Manifest type: single-arch Docker v2, as with tesserix-blog, so the
# `platform:` filter is intentionally OMITTED — including it would
# silently drop every tag (Phase-1 retrospective gotcha #10).
apiVersion: kargo.akuity.io/v1alpha1
kind: Warehouse
metadata:
  name: services
spec:
  freightCreationPolicy: Automatic
  interval: 300s
  subscriptions:
    - image:
        repoURL: asia-south1-docker.pkg.dev/tesseracthub-480811/ghcr-remote/tesserix/beautyandcruor
        imageSelectionStrategy: NewestBuild
        allowTagsRegexes:
          - '^main-[a-f0-9]{7,12}$'
        strictSemvers: false
        # 100, the hard cap, not 5.
        #
        # discoveryLimit truncates the registry's tag list BEFORE NewestBuild
        # sorts it, and that list comes back in arbitrary order. With 16 tags
        # and a limit of 5, discovery returned fed66af, e7d1527, dde3b9e,
        # d1f4a6d and cdd7545 — none of them the newest — and NewestBuild
        # dutifully picked the newest of those. Production rolled backwards to
        # a build from the previous evening and stayed there.
        #
        # This is the failure the devai warehouse documents at length, and it
        # bit stockpilot and scrapper before that: "NewestBuild then never sees
        # the newest build and silently promotes the newest of the stale page-1
        # tags, flapping prod backwards".
        #
        # 100 covers every tag this repo has, and branch builds no longer add
        # any (they carry their own branch prefix now), so the list grows by
        # one per merge to main. THE CEILING IS REAL THOUGH: at >100 tags this
        # breaks again exactly as before, and the fix then is the one devai
        # took — discover from the commit graph, which has a true order and no
        # pagination, and derive main-<sha7> from it.
        discoveryLimit: 100
    # Chart and Application changes promote too, so a values edit gets the
    # same audit trail as an image bump: which tesserix-k8s commit reached
    # prod, and when.
    #
    # includePaths are GLOBS unless prefixed, not regexes. Written as regexes
    # they match nothing and the Warehouse reports MissingCommits — which
    # fails the whole Warehouse, images included, so nothing is ever
    # promoted while the Project still reports "synced and ready for use".
    #
    # tesserix-blog carries the regex form and has always discovered commits
    # only through its one accidentally-literal path
    # (argocd/prod/apps/blog-app-of-apps.yaml, unescaped). Its
    # `charts/apps/tesserix-blog/.*` entry has never matched: that directory
    # changed in 8 of the last commits while the Warehouse discovered 5 —
    # exactly the count for the literal path alone. Worth fixing there too.
    #
    # The directory is given an explicit `regex:` prefix rather than a `**`
    # glob so the intent cannot be misread again; the two files are literal
    # and need no prefix.
    - git:
        repoURL: https://github.com/tesserix/tesserix-k8s.git
        branch: main
        includePaths:
          - regex:^charts/apps/beautyandcruor/
          - argocd/prod/apps/beautyandcruor/beautyandcruor.yaml
          - argocd/prod/apps/beautyandcruor-app-of-apps.yaml
