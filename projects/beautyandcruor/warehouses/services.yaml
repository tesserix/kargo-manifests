---
# Discovery is from the commit graph, not from image tags.
#
# NewestBuild cannot work through the ghcr-remote mirror. The mirror is
# pull-through, so the CREATE_TIME it reports is when it happened to cache a
# manifest, not when the image was built — three different builds here share a
# timestamp to the second. Sorting on that is arbitrary, and it promoted a
# build from the previous evening over one made an hour earlier, rolling the
# site back past its favicon and its analytics.
#
# Raising discoveryLimit did not help and could not: the ordering itself is
# meaningless, not merely truncated. devai reached the same conclusion from
# the tag-pagination direction and its warehouse says so at length — the git
# commit graph has a true order and no pagination.
#
# The Stage derives main-<sha7> from the commit, which is exactly the tag CI
# builds.
apiVersion: kargo.akuity.io/v1alpha1
kind: Warehouse
metadata:
  name: services
  annotations:
    # Bump when the only change here is a field argocd-cm ignores at diff
    # time (interval, discoveryLimit, strictSemvers, commitSelectionStrategy).
    # Sync applies the full spec, but no diff means no sync, so such a change
    # sits in git looking applied and never lands. This is how
    # discoveryLimit: 100 stayed inert while production ran a stale image.
    beautyandcruor.tesserix.app/spec-revision: "3"
spec:
  freightCreationPolicy: Automatic
  interval: 300s
  subscriptions:
    # `deploy`, NOT main. CI fast-forwards it only after both images are
    # pushed, so a commit is never visible here before the tag it implies
    # exists. Watching main raced the build, and the GAR mirror
    # negative-caches the resulting 404 into an ImagePullBackOff that does not
    # recover.
    #
    # It also handles the path filter: a docs-only commit builds no image and
    # never advances deploy, so it is never promoted.
    - git:
        repoURL: https://github.com/tesserix/beautyandcruor.git
        branch: deploy
        commitSelectionStrategy: NewestFromBranch
        discoveryLimit: 20

    # Chart and Application changes promote too, so a values edit gets the
    # same audit trail as an image bump.
    #
    # includePaths are GLOBS unless prefixed, not regexes. Written as regexes
    # they match nothing, the Warehouse reports MissingCommits, and that fails
    # the whole Warehouse — every subscription, not just this one.
    - git:
        repoURL: https://github.com/tesserix/tesserix-k8s.git
        branch: main
        includePaths:
          - regex:^charts/apps/beautyandcruor/
          - argocd/prod/apps/beautyandcruor/beautyandcruor.yaml
          - argocd/prod/apps/beautyandcruor-app-of-apps.yaml
