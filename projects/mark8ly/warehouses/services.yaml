---
# mark8ly's CI builds every service from the same commit, so every
# `:sha-<12hex>` tag appears across all 7 image repos at roughly the
# same time. We model that as a SINGLE Warehouse with 7 image
# subscriptions — Kargo emits one Freight when ANY subscription sees a
# new tag, and that single Freight references the latest tags across
# every service. The prod Stage promotes them as one bundle.
#
# Note: the chart values in tesserix-k8s reference the GAR mirror
# (`asia-south1-docker.pkg.dev/tesseracthub-480811/ghcr-remote/tesserix/...`),
# but the Warehouse subscribes to GHCR directly because:
#   - we already have a working PAT for GHCR (prod-ghcr-token)
#   - GAR ACL only allows the GKE node SA, not the kargo-controller
#   - tag listing has no bandwidth cost so the GAR mirror's main
#     justification (NAT savings) doesn't apply here
# `argocd-update` updates `image.tag` only, leaving image.repository
# pointed at GAR for the actual pod pull.
apiVersion: kargo.akuity.io/v1alpha1
kind: Warehouse
metadata:
  name: services
spec:
  freightCreationPolicy: Automatic
  interval: 300s
  subscriptions:
    - image:
        repoURL: ghcr.io/tesserix/mark8ly-admin
        imageSelectionStrategy: NewestBuild
        allowTags: '^main-[a-f0-9]{7,12}$'
        strictSemvers: false
        discoveryLimit: 5
    - image:
        repoURL: ghcr.io/tesserix/mark8ly-auth-bff
        imageSelectionStrategy: NewestBuild
        allowTags: '^main-[a-f0-9]{7,12}$'
        strictSemvers: false
        discoveryLimit: 5
    - image:
        repoURL: ghcr.io/tesserix/mark8ly-marketplace-api
        imageSelectionStrategy: NewestBuild
        allowTags: '^main-[a-f0-9]{7,12}$'
        strictSemvers: false
        discoveryLimit: 5
    - image:
        repoURL: ghcr.io/tesserix/mark8ly-onboarding
        imageSelectionStrategy: NewestBuild
        allowTags: '^main-[a-f0-9]{7,12}$'
        strictSemvers: false
        discoveryLimit: 5
    - image:
        repoURL: ghcr.io/tesserix/mark8ly-otto
        imageSelectionStrategy: NewestBuild
        allowTags: '^main-[a-f0-9]{7,12}$'
        strictSemvers: false
        discoveryLimit: 5
    - image:
        repoURL: ghcr.io/tesserix/mark8ly-platform-api
        imageSelectionStrategy: NewestBuild
        allowTags: '^main-[a-f0-9]{7,12}$'
        strictSemvers: false
        discoveryLimit: 5
    - image:
        repoURL: ghcr.io/tesserix/mark8ly-storefront
        imageSelectionStrategy: NewestBuild
        allowTags: '^main-[a-f0-9]{7,12}$'
        strictSemvers: false
        discoveryLimit: 5
    # Playwright e2e runner image. Smoke Stage bumps this on the
    # mark8ly-uat-e2e-tests Argo CD App which recreates a Job that
    # runs the suite against UAT URLs. Built by the mark8ly tracks
    # in the playwright-tests repo on push to main.
    - image:
        repoURL: ghcr.io/tesserix/mark8ly-uat-e2e
        imageSelectionStrategy: NewestBuild
        allowTags: '^main-[a-f0-9]{7,12}$'
        strictSemvers: false
        discoveryLimit: 5
        # main-6308899 is a DANGLING TAG: it still exists on GHCR but the
        # manifest it points at (sha256:5e61ba9e...) returns MANIFEST_UNKNOWN,
        # so resolving it fails.
        #
        # Kargo discovers all subscriptions as one unit, so this single bad tag
        # failed the whole Warehouse and NO freight was produced for any of the
        # nine images — mark8ly stopped receiving promotions entirely while
        # every individual build was green. The symptom is silent: Stages stay
        # Healthy on old freight and nothing reports an error.
        #
        # Ignoring the tag unblocks discovery. It does not address why a
        # referenced manifest disappeared from GHCR; if more tags dangle, the
        # cause needs finding rather than adding entries here.
        ignoreTags:
          - main-6308899
    # Track tesserix-k8s commits that touch this product's Helm chart
    # / values / ArgoCD Application YAML. Kargo emits a Freight on
    # every matching commit, the Stage promotes it, and ArgoCD's
    # auto-sync picks up the actual deploy. Kargo provides the audit
    # trail (which tesserix-k8s commit got promoted to prod, when).
    - git:
        repoURL: https://github.com/tesserix/tesserix-k8s.git
        branch: main
        includePaths:
          - charts/apps/mark8ly-.*
          - argocd/prod/apps/mark8ly/.*
          - argocd/prod/apps/mark8ly-app-of-apps.yaml
