---
# Kargo enforces: Project.metadata.name == namespace name. So the
# Project is called `kargo-mark8ly` to match the kargo-mark8ly
# namespace pre-created here.
apiVersion: v1
kind: Namespace
metadata:
  name: kargo-mark8ly
  labels:
    app.kubernetes.io/part-of: tesseract-platform
    app.kubernetes.io/component: release
    # Per Kargo source (api/v1alpha1/labels.go LabelValueTrue), this
    # label's value MUST be the literal string "true", not the project
    # name.
    kargo.akuity.io/project: "true"
---
apiVersion: kargo.akuity.io/v1alpha1
kind: Project
metadata:
  name: kargo-mark8ly
  annotations:
    kargo.akuity.io/description: |
      mark8ly multi-tenant marketplace platform.
      Promotion model (prod delinked from UAT):
        Warehouse -> prod        (direct, fully auto-promoted)
        Warehouse -> uat -> smoke (independent, manual QA track)
      Every new image (or matching tesserix-k8s commit) auto-promotes
      straight to prod. The uat/smoke track is manually triggered for
      QA and no longer gates prod. UAT runs in the mark8ly-uat namespace
      at admin-uat.mark8ly.com / uat.mark8ly.com / onboarding-uat.mark8ly.com
      (idle at 0 replicas via KEDA scale-to-zero); prod stays in the
      mark8ly namespace.
---
apiVersion: kargo.akuity.io/v1alpha1
kind: ProjectConfig
metadata:
  name: kargo-mark8ly
  namespace: kargo-mark8ly
spec:
  promotionPolicies:
    # Prod is FULLY automated: it sources Freight directly from the
    # Warehouse (see stages/prod.yaml) and auto-promotes every new
    # build straight to prod with no lower-env gate.
    #
    # UAT is now MANUAL — Freight only enters uat when an operator
    # triggers it via the Kargo UI or `kubectl create promotion`. Smoke
    # auto-follows uat so a manual UAT promotion still runs e2e, but the
    # whole uat -> smoke track is decoupled from prod.
    - stage: prod
      autoPromotionEnabled: true
    - stage: uat
      autoPromotionEnabled: false
    - stage: smoke
      autoPromotionEnabled: true
