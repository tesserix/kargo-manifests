---
# Kargo enforces: Project.metadata.name == namespace name. So the
# Project is called `kargo-mark8ly` to match the kargo-mark8ly
# namespace pre-created here.
apiVersion: v1
kind: Namespace
metadata:
  name: kargo-mark8ly
  labels:
    app.kubernetes.io/part-of: tesseract-platform
    app.kubernetes.io/component: release
    # Per Kargo source (api/v1alpha1/labels.go LabelValueTrue), this
    # label's value MUST be the literal string "true", not the project
    # name.
    kargo.akuity.io/project: "true"
---
apiVersion: kargo.akuity.io/v1alpha1
kind: Project
metadata:
  name: kargo-mark8ly
  annotations:
    kargo.akuity.io/description: |
      mark8ly multi-tenant marketplace platform.
      Three-stage cascading promotion:
        Warehouse -> uat -> smoke -> prod
      Every new image (or matching tesserix-k8s commit) lands in UAT
      first, smokes (placeholder no-op today; AnalysisTemplate when
      real probes ship), then auto-promotes to prod. UAT runs in the
      mark8ly-uat namespace at admin-uat.mark8ly.com / uat.mark8ly.com /
      onboarding-uat.mark8ly.com; prod stays in the mark8ly namespace.
---
apiVersion: kargo.akuity.io/v1alpha1
kind: ProjectConfig
metadata:
  name: kargo-mark8ly
  namespace: kargo-mark8ly
spec:
  promotionPolicies:
    # Auto-promote at every step of the chain. Once smoke gets real
    # tests, a failed AnalysisRun blocks the prod Stage from picking
    # up the Freight so this stays safe.
    - stage: uat
      autoPromotionEnabled: true
    - stage: smoke
      autoPromotionEnabled: true
    - stage: prod
      autoPromotionEnabled: true
