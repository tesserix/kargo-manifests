---
# Kargo enforces: Project.metadata.name == namespace name. So the
# Project is called `kargo-mark8ly` to match the kargo-mark8ly
# namespace pre-created here.
apiVersion: v1
kind: Namespace
metadata:
  name: kargo-mark8ly
  labels:
    app.kubernetes.io/part-of: tesseract-platform
    app.kubernetes.io/component: release
    # Per Kargo source (api/v1alpha1/labels.go LabelValueTrue), this
    # label's value MUST be the literal string "true", not the project
    # name.
    kargo.akuity.io/project: "true"
---
apiVersion: kargo.akuity.io/v1alpha1
kind: Project
metadata:
  name: kargo-mark8ly
  annotations:
    kargo.akuity.io/description: |
      mark8ly multi-tenant marketplace platform.
      Promotion model:
        Warehouse -> prod (direct, fully auto-promoted)
      Every new image (or matching tesserix-k8s commit) auto-promotes
      straight to prod with no lower-env gate. The uat and smoke Stages
      were removed with the UAT environment itself (tesserix-k8s #101,
      2026-07-26); restore them from git history alongside the
      mark8ly-uat Applications if a staging track is needed again.
---
apiVersion: kargo.akuity.io/v1alpha1
kind: ProjectConfig
metadata:
  name: kargo-mark8ly
  namespace: kargo-mark8ly
spec:
  promotionPolicies:
    # Prod is FULLY automated: it sources Freight directly from the
    # Warehouse (see stages/prod.yaml) and auto-promotes every new
    # build straight to prod with no lower-env gate.
    - stage: prod
      autoPromotionEnabled: true
