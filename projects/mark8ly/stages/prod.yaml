---
# Prod Stage — DELINKED from the UAT track and fully self-automated.
#
# Prod subscribes directly to the bundled Warehouse, so every new image
# build (main-<sha>) becomes Freight that auto-promotes straight to prod
# (autoPromotionEnabled: true in project.yaml). The uat -> smoke chain is
# now an independent, manually-triggered QA track and is no longer a gate
# on prod. To re-gate prod behind UAT/smoke later, switch `sources` back
# to `stages: [uat]` (or add `smoke` once it has real probes).
#
# Each prod Argo CD Application has annotation
#   kargo.akuity.io/authorized-stage: mark8ly:prod
# without which Kargo refuses to mutate it.
#
# The `argocd-update` step writes the new `image.tag` value into each
# Application's spec.source.helm.parameters list. ArgoCD's automated
# sync then rolls the Knative service / Deployment.
#
# `imageFrom("<repoURL>")` pulls the matching image entry from the
# current Freight; `.Tag` returns the discovered tag (e.g.
# "sha-493c3652c68d").
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: prod
  annotations:
    kargo.akuity.io/color: '#EE4E4E'
spec:
  requestedFreight:
    - origin:
        kind: Warehouse
        name: services
      sources:
        # Direct from the Warehouse — prod is NOT sourced from uat/smoke.
        # Combined with prod.autoPromotionEnabled: true (project.yaml),
        # every new Freight promotes straight to prod with no lower-env
        # gate. Switch back to `stages: [uat]` to re-couple prod to UAT.
        direct: true
  promotionTemplate:
    spec:
      vars:
        - name: argocdRepo
          value: https://github.com/tesserix/tesserix-k8s.git

      steps:
        # ----- mark8ly-admin -----
        - uses: argocd-update
          config:
            apps:
              - name: mark8ly-admin
                namespace: argocd
                sources:
                  - repoURL: ${{ vars.argocdRepo }}
                    helm:
                      images:
                        - key: image.tag
                          value: ${{ imageFrom("ghcr.io/tesserix/mark8ly-admin").Tag }}

        # ----- mark8ly-auth-bff -----
        - uses: argocd-update
          config:
            apps:
              - name: mark8ly-auth-bff
                namespace: argocd
                sources:
                  - repoURL: ${{ vars.argocdRepo }}
                    helm:
                      images:
                        - key: image.tag
                          value: ${{ imageFrom("ghcr.io/tesserix/mark8ly-auth-bff").Tag }}

        # ----- mark8ly-marketplace-api (used by both admin + storefront Apps) -----
        - uses: argocd-update
          config:
            apps:
              - name: mark8ly-marketplace-api-admin
                namespace: argocd
                sources:
                  - repoURL: ${{ vars.argocdRepo }}
                    helm:
                      images:
                        - key: image.tag
                          value: ${{ imageFrom("ghcr.io/tesserix/mark8ly-marketplace-api").Tag }}
        - uses: argocd-update
          config:
            apps:
              - name: mark8ly-marketplace-api-storefront
                namespace: argocd
                sources:
                  - repoURL: ${{ vars.argocdRepo }}
                    helm:
                      images:
                        - key: image.tag
                          value: ${{ imageFrom("ghcr.io/tesserix/mark8ly-marketplace-api").Tag }}

        # ----- mark8ly-onboarding -----
        - uses: argocd-update
          config:
            apps:
              - name: mark8ly-onboarding
                namespace: argocd
                sources:
                  - repoURL: ${{ vars.argocdRepo }}
                    helm:
                      images:
                        - key: image.tag
                          value: ${{ imageFrom("ghcr.io/tesserix/mark8ly-onboarding").Tag }}

        # ----- mark8ly-otto -----
        - uses: argocd-update
          config:
            apps:
              - name: mark8ly-otto
                namespace: argocd
                sources:
                  - repoURL: ${{ vars.argocdRepo }}
                    helm:
                      images:
                        - key: image.tag
                          value: ${{ imageFrom("ghcr.io/tesserix/mark8ly-otto").Tag }}

        # ----- mark8ly-platform-api -----
        - uses: argocd-update
          config:
            apps:
              - name: mark8ly-platform-api
                namespace: argocd
                sources:
                  - repoURL: ${{ vars.argocdRepo }}
                    helm:
                      images:
                        - key: image.tag
                          value: ${{ imageFrom("ghcr.io/tesserix/mark8ly-platform-api").Tag }}

        # ----- mark8ly-storefront -----
        - uses: argocd-update
          config:
            apps:
              - name: mark8ly-storefront
                namespace: argocd
                sources:
                  - repoURL: ${{ vars.argocdRepo }}
                    helm:
                      images:
                        - key: image.tag
                          value: ${{ imageFrom("ghcr.io/tesserix/mark8ly-storefront").Tag }}
