---
# Final Stage in the cascade: uat -> smoke -> prod.
#
# Only Freight that has cleared the upstream `smoke` Stage is eligible
# for prod promotion. To bypass the chain for an emergency hot-fix,
# temporarily switch `sources` to `direct: true`, promote, then revert.
#
# Each prod Argo CD Application has annotation
#   kargo.akuity.io/authorized-stage: mark8ly:prod
# without which Kargo refuses to mutate it.
#
# The `argocd-update` step writes the new `image.tag` value into each
# Application's spec.source.helm.parameters list. ArgoCD's automated
# sync then rolls the Knative service / Deployment.
#
# `imageFrom("<repoURL>")` pulls the matching image entry from the
# current Freight; `.Tag` returns the discovered tag (e.g.
# "sha-493c3652c68d").
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: prod
  annotations:
    kargo.akuity.io/color: '#EE4E4E'
spec:
  requestedFreight:
    - origin:
        kind: Warehouse
        name: services
      sources:
        # Cascade gate: prod can only consume Freight that has been
        # promoted to `smoke` (which itself only sees Freight from
        # `uat`). Linear chain, no parallel Warehouse->prod path.
        stages:
          - smoke
  promotionTemplate:
    spec:
      vars:
        - name: argocdRepo
          value: https://github.com/tesserix/tesserix-k8s.git

      steps:
        # ----- mark8ly-admin -----
        - uses: argocd-update
          config:
            apps:
              - name: mark8ly-admin
                namespace: argocd
                sources:
                  - repoURL: ${{ vars.argocdRepo }}
                    helm:
                      images:
                        - key: image.tag
                          value: ${{ imageFrom("asia-south1-docker.pkg.dev/tesseracthub-480811/ghcr-remote/tesserix/mark8ly-admin").Tag }}

        # ----- mark8ly-auth-bff -----
        - uses: argocd-update
          config:
            apps:
              - name: mark8ly-auth-bff
                namespace: argocd
                sources:
                  - repoURL: ${{ vars.argocdRepo }}
                    helm:
                      images:
                        - key: image.tag
                          value: ${{ imageFrom("asia-south1-docker.pkg.dev/tesseracthub-480811/ghcr-remote/tesserix/mark8ly-auth-bff").Tag }}

        # ----- mark8ly-marketplace-api (used by both admin + storefront Apps) -----
        - uses: argocd-update
          config:
            apps:
              - name: mark8ly-marketplace-api-admin
                namespace: argocd
                sources:
                  - repoURL: ${{ vars.argocdRepo }}
                    helm:
                      images:
                        - key: image.tag
                          value: ${{ imageFrom("asia-south1-docker.pkg.dev/tesseracthub-480811/ghcr-remote/tesserix/mark8ly-marketplace-api").Tag }}
        - uses: argocd-update
          config:
            apps:
              - name: mark8ly-marketplace-api-storefront
                namespace: argocd
                sources:
                  - repoURL: ${{ vars.argocdRepo }}
                    helm:
                      images:
                        - key: image.tag
                          value: ${{ imageFrom("asia-south1-docker.pkg.dev/tesseracthub-480811/ghcr-remote/tesserix/mark8ly-marketplace-api").Tag }}

        # ----- mark8ly-onboarding -----
        - uses: argocd-update
          config:
            apps:
              - name: mark8ly-onboarding
                namespace: argocd
                sources:
                  - repoURL: ${{ vars.argocdRepo }}
                    helm:
                      images:
                        - key: image.tag
                          value: ${{ imageFrom("asia-south1-docker.pkg.dev/tesseracthub-480811/ghcr-remote/tesserix/mark8ly-onboarding").Tag }}

        # ----- mark8ly-otto -----
        - uses: argocd-update
          config:
            apps:
              - name: mark8ly-otto
                namespace: argocd
                sources:
                  - repoURL: ${{ vars.argocdRepo }}
                    helm:
                      images:
                        - key: image.tag
                          value: ${{ imageFrom("asia-south1-docker.pkg.dev/tesseracthub-480811/ghcr-remote/tesserix/mark8ly-otto").Tag }}

        # ----- mark8ly-platform-api -----
        - uses: argocd-update
          config:
            apps:
              - name: mark8ly-platform-api
                namespace: argocd
                sources:
                  - repoURL: ${{ vars.argocdRepo }}
                    helm:
                      images:
                        - key: image.tag
                          value: ${{ imageFrom("asia-south1-docker.pkg.dev/tesseracthub-480811/ghcr-remote/tesserix/mark8ly-platform-api").Tag }}

        # ----- mark8ly-storefront -----
        - uses: argocd-update
          config:
            apps:
              - name: mark8ly-storefront
                namespace: argocd
                sources:
                  - repoURL: ${{ vars.argocdRepo }}
                    helm:
                      images:
                        - key: image.tag
                          value: ${{ imageFrom("asia-south1-docker.pkg.dev/tesseracthub-480811/ghcr-remote/tesserix/mark8ly-storefront").Tag }}
