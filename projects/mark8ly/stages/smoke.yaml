---
# Smoke Stage — runs the Playwright e2e suite against UAT.
#
# How this works:
#   1. The argocd-update step writes a fresh image.tag onto the
#      `mark8ly-uat-e2e-tests` Argo CD Application in the cluster.
#   2. Argo CD syncs that Application. The Helm chart it points at
#      contains a Kubernetes Job annotated `argocd.argoproj.io/hook: Sync`
#      so each sync recreates the Job with the new image.
#   3. The Job pulls ghcr.io/tesserix/mark8ly-uat-e2e:<tag> and runs
#      `npm run test:mark8ly` against
#        - https://tesserix-store-admin-uat.mark8ly.com
#        - https://tesserix-store-uat.mark8ly.com
#      reading credentials from a K8s Secret synced by ESO from the
#      `prod-mark8ly-uat-playwright-creds` GCP Secret Manager entry.
#   4. Kargo's argocd-update wait-for-healthy gate succeeds only when
#      Argo CD reports the App+Job as Healthy (Job exit 0). A failed
#      Job leaves the Stage Errored and blocks prod auto-promotion.
#
# To bypass smoke for an emergency hot-fix, switch prod's `sources` to
# `direct: true` temporarily and revert after.
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: smoke
  annotations:
    kargo.akuity.io/color: '#F59E0B'   # amber — smoke / staging gate
spec:
  requestedFreight:
    - origin:
        kind: Warehouse
        name: services
      sources:
        # Cascade: only Freight that has cleared the `uat` Stage is
        # eligible to be promoted into smoke.
        stages:
          - uat
  promotionTemplate:
    spec:
      vars:
        - name: argocdRepo
          value: https://github.com/tesserix/tesserix-k8s.git
        # Image repo for the Playwright runner. Built by the
        # `build mark8ly-uat-e2e` workflow in
        # https://github.com/tesserix/playwright-tests on every push
        # to mark8ly/* — Kargo discovers new tags via the same
        # Warehouse subscription the rest of the project uses.
        - name: e2eImageRepo
          value: asia-south1-docker.pkg.dev/tesseracthub-480811/ghcr-remote/tesserix/mark8ly-uat-e2e
      steps:
        # Bump the e2e Job's image.tag → triggers an Argo CD sync →
        # recreates the Job → Job runs Playwright against UAT →
        # Kargo waits for App health (= Job success).
        - uses: argocd-update
          config:
            apps:
              - name: mark8ly-uat-e2e-tests
                namespace: argocd
                sources:
                  - repoURL: ${{ vars.argocdRepo }}
                    helm:
                      images:
                        - key: image.tag
                          value: ${{ imageFrom(vars.e2eImageRepo).Tag }}
