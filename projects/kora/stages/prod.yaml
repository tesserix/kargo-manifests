---
# Single prod Stage — auto-promotes Freight from the `services` Warehouse onto
# the kora-api ArgoCD Application.
#
# image.tag is derived from the source repo's newest commit on `deploy` (NOT
# imageFrom), because kora-api's tag list is already past the 100-tag pagination
# limit that breaks NewestBuild discovery — see the warehouse for the incident
# note. Kora's CI tags each build with the FULL commit sha, so resolving the tag
# from the commit ID yields the same image without the broken registry-tag
# discovery. The image is still PULLED from GAR (image.repository in the chart's
# values is the GAR mirror); only the tag SOURCE differs.
#
# The kora-api ArgoCD Application already carries
# kargo.akuity.io/authorized-stage: kargo-kora:prod.
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: prod
  annotations:
    kargo.akuity.io/color: '#00897B'
spec:
  requestedFreight:
    - origin:
        kind: Warehouse
        name: services
      sources:
        direct: true
  promotionTemplate:
    spec:
      vars:
        - name: argocdRepo
          value: https://github.com/tesserix/tesserix-k8s.git
        # Full 40-char commit sha from tesserix/kora's `deploy` HEAD. Kora's CI
        # tags with github.sha (the whole sha), unlike devai's main-<sha7>.
        - name: imageTag
          value: ${{ commitFrom("https://github.com/tesserix/kora.git").ID }}

      steps:
        # ----- kora-api (Go/Gin API) -----
        - uses: argocd-update
          config:
            apps:
              - name: kora-api
                namespace: argocd
                sources:
                  - repoURL: ${{ vars.argocdRepo }}
                    helm:
                      images:
                        - key: image.tag
                          value: ${{ vars.imageTag }}
