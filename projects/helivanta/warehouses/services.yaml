---
# Helivanta Freight = the release/prod commit plus the exact helivanta-api and helivanta-shell
# digests that tesserix/helivanta's scripts/release-prod.sh verified and tagged release-prod.
#
# Images use the Digest strategy: it reads only the release-prod tag, never the tag list, which
# is past Kargo's 100-tag discovery cap (the DevAI 2026-06-09 backwards-promotion incident).
# Discovery reads ghcr.io directly because the GAR mirror caches moved tags; pods still pull
# from the mirror, by digest.
#
# release/prod moves only from an approved Release run, after both tags. The criteria below
# create Freight only once every image's revision annotation names that commit, so a tag moved
# without the branch, or a half-finished release, never reaches production.
apiVersion: kargo.akuity.io/v1alpha1
kind: Warehouse
metadata:
  name: services
spec:
  freightCreationPolicy: Automatic
  # Kargo normalizes durations to Go's canonical form (300s -> 5m0s); use the
  # normalized form so the Warehouse doesn't perpetually show OutOfSync.
  interval: 5m0s
  freightCreationCriteria:
    # Missing values coalesce to '' so the expression always yields false, never an error.
    expression: |-
      let commit = commitFrom('https://github.com/tesserix/helivanta.git')?.ID ?? '';
      let api = imageFrom('ghcr.io/tesserix/helivanta/helivanta-api')?.Annotations?.['org.opencontainers.image.revision'] ?? '';
      let shell = imageFrom('ghcr.io/tesserix/helivanta/helivanta-shell')?.Annotations?.['org.opencontainers.image.revision'] ?? '';
      commit != '' && api == commit && shell == commit
  subscriptions:
    - git:
        repoURL: https://github.com/tesserix/helivanta.git
        branch: release/prod
        commitSelectionStrategy: NewestFromBranch
        discoveryLimit: 20
    - image:
        repoURL: ghcr.io/tesserix/helivanta/helivanta-api
        imageSelectionStrategy: Digest
        constraint: release-prod
        discoveryLimit: 1
    - image:
        repoURL: ghcr.io/tesserix/helivanta/helivanta-shell
        imageSelectionStrategy: Digest
        constraint: release-prod
        discoveryLimit: 1
