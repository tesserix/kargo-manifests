---
# Single prod Stage — promotes reviewed Freight from the `services` Warehouse
# onto the product API, Global API and shell in order.
#
# The two images are promoted TOGETHER, from one commit, deliberately. ADR-0001
# states a Helivanta PR spans frontend and backend, so the api and the shell at
# the same commit are the pair that was built and tested together. Promoting
# them independently would let a shell that expects a new API route run against
# an API that does not serve it yet — a skew that exists only because the
# deployment split them, never because anyone wrote them apart.
#
# Each workload is pinned to its Freight's image digest, the one helivanta's
# release script verified (revision annotation + main-workflow signature) before
# tagging it release-prod. The charts render repository:tag, so image.tag is
# <commit>@<digest>: the commit stays readable, the digest decides the pull.
#
# Each chart is pinned to the Freight's tesserix-k8s commit, so a rollback restores the chart too.
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: prod
  annotations:
    kargo.akuity.io/color: '#2D4A2B'
spec:
  requestedFreight:
    - origin:
        kind: Warehouse
        name: services
      sources:
        direct: true
  promotionTemplate:
    spec:
      vars:
        - name: argocdRepo
          value: https://github.com/tesserix/tesserix-k8s.git
        - name: commit
          value: ${{ commitFrom("https://github.com/tesserix/helivanta.git").ID }}
        # Freight from before the image subscriptions has no digest and keeps deploying by commit tag.
        - name: apiDigest
          value: ${{ imageFrom("ghcr.io/tesserix/helivanta/helivanta-api")?.Digest ?? "" }}
        - name: shellDigest
          value: ${{ imageFrom("ghcr.io/tesserix/helivanta/helivanta-shell")?.Digest ?? "" }}
        - name: apiTag
          value: '${{ vars.apiDigest == "" ? vars.commit : vars.commit + "@" + vars.apiDigest }}'
        - name: shellTag
          value: '${{ vars.shellDigest == "" ? vars.commit : vars.commit + "@" + vars.shellDigest }}'
        # Freight from before the tesserix-k8s subscription gets the charts production ran at cutover.
        - name: chartCommit
          value: ${{ commitFrom(vars.argocdRepo)?.ID ?? "08f5f729cc62e89947dc8c0db08a7e78c8bfe361" }}

      steps:
        # ----- helivanta-api (Go/Gin API; also ships /app/migrate) -----
        #
        # The migrate Job runs from this SAME image as an ArgoCD PreSync hook,
        # so promoting the API tag also promotes the migrations, and they run
        # before the new pods start. That ordering is load-bearing: #894's
        # grant migrations had to land before the API that depends on them
        # could boot.
        - uses: argocd-update
          config:
            apps:
              - name: helivanta-api
                namespace: argocd
                sources:
                  - repoURL: ${{ vars.argocdRepo }}
                    desiredRevision: ${{ vars.chartCommit }}
                    updateTargetRevision: true
                    helm:
                      images:
                        - key: image.tag
                          value: ${{ vars.apiTag }}

        # The connector must match the reviewed backend before the shell advances.
        - uses: argocd-update
          config:
            apps:
              - name: helivanta-global-api
                namespace: argocd
                sources:
                  - repoURL: ${{ vars.argocdRepo }}
                    desiredRevision: ${{ vars.chartCommit }}
                    updateTargetRevision: true
                    helm:
                      images:
                        - key: image.tag
                          value: ${{ vars.apiTag }}

        # ----- helivanta-shell (Next.js shell, serves the branded login) -----
        - uses: argocd-update
          config:
            apps:
              - name: helivanta-shell
                namespace: argocd
                sources:
                  - repoURL: ${{ vars.argocdRepo }}
                    desiredRevision: ${{ vars.chartCommit }}
                    updateTargetRevision: true
                    helm:
                      images:
                        - key: image.tag
                          value: ${{ vars.shellTag }}
