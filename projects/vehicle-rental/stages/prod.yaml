---
# Prod sources Freight straight from the Warehouse and auto-promotes it
# (project.yaml). `argocd-update` writes image.tag into each Application's
# helm parameters; ArgoCD's own auto-sync does the rollout.
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: prod
  annotations:
    kargo.akuity.io/color: '#2E8B57'
spec:
  requestedFreight:
    - origin:
        kind: Warehouse
        name: services
      sources:
        direct: true
  promotionTemplate:
    spec:
      vars:
        - name: argocdRepo
          value: https://github.com/tesserix/tesserix-k8s.git

      steps:
        - uses: argocd-update
          config:
            apps:
              - name: vehicle-rental-api
                namespace: argocd
                sources:
                  - repoURL: ${{ vars.argocdRepo }}
                    helm:
                      images:
                        - key: image.tag
                          value: ${{ imageFrom("ghcr.io/tesserix/vehicle-rental-api").Tag }}

        - uses: argocd-update
          config:
            apps:
              - name: vehicle-rental-storefront
                namespace: argocd
                sources:
                  - repoURL: ${{ vars.argocdRepo }}
                    helm:
                      images:
                        - key: image.tag
                          value: ${{ imageFrom("ghcr.io/tesserix/vehicle-rental-storefront").Tag }}

        - uses: argocd-update
          config:
            apps:
              - name: vehicle-rental-admin
                namespace: argocd
                sources:
                  - repoURL: ${{ vars.argocdRepo }}
                    helm:
                      images:
                        - key: image.tag
                          value: ${{ imageFrom("ghcr.io/tesserix/vehicle-rental-admin").Tag }}

        - uses: argocd-update
          config:
            apps:
              - name: vehicle-rental-onboarding
                namespace: argocd
                sources:
                  - repoURL: ${{ vars.argocdRepo }}
                    helm:
                      images:
                        - key: image.tag
                          value: ${{ imageFrom("ghcr.io/tesserix/vehicle-rental-onboarding").Tag }}
