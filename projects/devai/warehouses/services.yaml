---
# DevAI ships five images from the same monorepo (tesserix/devai).
# Each push to main re-tags both `:latest` and `:main-<sha>` on each
# image. We watch the SHA-stamped tags so promotion freight has a
# stable, reproducible reference (unlike `:latest` which mutates).
#
# Manifest type:
#   devai + devai-sre are linux/amd64 OCI image indexes (Python
#   FastAPI services). dashboard, sre-dashboard, and auth-bff are
#   pushed as multi-arch (linux/amd64-only today). The `platform`
#   filter is required for image-index manifests — without it the
#   tag is silently filtered.
#
# Subscription form mirrors homechef's `services` warehouse exactly,
# so promotion logic in prod stage stays grep-replaceable across
# products.
apiVersion: kargo.akuity.io/v1alpha1
kind: Warehouse
metadata:
  name: services
spec:
  freightCreationPolicy: Automatic
  # DEP-8: Kargo normalizes durations to Go's canonical form (300s -> 5m0s),
  # so writing 300s here leaves the Warehouse perpetually OutOfSync against the
  # live object. Use the normalized form to match what the controller stores.
  interval: 5m0s
  subscriptions:
    # ALM pipeline backend (FastAPI + LangGraph) — and devai-mcp-hub, which
    # shares this image.
    # ALWAYS the in-region GAR pull-through — NEVER ghcr.io directly. Pods must
    # pull from GAR to avoid GHCR egress cost; GAR mirrors GHCR on demand.
    # GAR proxies the FULL upstream tag list (~100 tags incl. the newest), but
    # Kargo only inspects `discoveryLimit` of them for NewestBuild — at 5 it
    # missed newer builds and devai-api/mcp-hub flapped back to a stale image
    # (DELETE route 405'd). Raised so the true newest build is always in the
    # candidate set.
    - image:
        repoURL: asia-south1-docker.pkg.dev/tesseracthub-480811/ghcr-remote/tesserix/devai/devai
        imageSelectionStrategy: NewestBuild
        allowTags: '^main-[a-f0-9]{7,12}$'
        strictSemvers: false
        platform: linux/amd64
        discoveryLimit: 100

    # SRE autonomous scanner (FastAPI)
    - image:
        repoURL: asia-south1-docker.pkg.dev/tesseracthub-480811/ghcr-remote/tesserix/devai/devai-sre
        imageSelectionStrategy: NewestBuild
        allowTags: '^main-[a-f0-9]{7,12}$'
        strictSemvers: false
        platform: linux/amd64
        discoveryLimit: 100

    # ALM Dashboard (Next.js)
    - image:
        repoURL: asia-south1-docker.pkg.dev/tesseracthub-480811/ghcr-remote/tesserix/devai/devai-dashboard
        imageSelectionStrategy: NewestBuild
        allowTags: '^main-[a-f0-9]{7,12}$'
        strictSemvers: false
        platform: linux/amd64
        discoveryLimit: 100

    # SRE Dashboard (Next.js)
    - image:
        repoURL: asia-south1-docker.pkg.dev/tesseracthub-480811/ghcr-remote/tesserix/devai/devai-sre-dashboard
        imageSelectionStrategy: NewestBuild
        allowTags: '^main-[a-f0-9]{7,12}$'
        strictSemvers: false
        platform: linux/amd64
        discoveryLimit: 100

    # Auth BFF (Go, GIP-backed). Replaces the previous shared
    # global-services/auth-bff image. Lives in services/auth-bff/ of
    # the devai monorepo and is built by .github/workflows/auth-bff-build.yaml.
    - image:
        repoURL: asia-south1-docker.pkg.dev/tesseracthub-480811/ghcr-remote/tesserix/devai/devai-auth-bff
        imageSelectionStrategy: NewestBuild
        allowTags: '^main-[a-f0-9]{7,12}$'
        strictSemvers: false
        platform: linux/amd64
        discoveryLimit: 100

    # Agent Registry (Go) — our own registry serving aregistry.tesserix.app,
    # replacing the third-party agentregistry-dev deployment. Built from the
    # separate tesserix/agentic-registry repo (deploy/Dockerfile), not the
    # devai monorepo, but promoted in lock-step with the DevAI stack since the
    # BFF / registry-bootstrap / postgres it depends on all live in `devai`.
    - image:
        repoURL: asia-south1-docker.pkg.dev/tesseracthub-480811/ghcr-remote/tesserix/agentic-registry
        imageSelectionStrategy: NewestBuild
        allowTags: '^main-[a-f0-9]{7,12}$'
        strictSemvers: false
        # NO platform filter here. Unlike the devai images (multi-arch OCI
        # indexes, where the filter is required), agentic-registry is built as a
        # single linux/amd64 manifest (image-build.yml: platforms: linux/amd64,
        # provenance: false). On a single manifest the platform filter matches
        # nothing -> "No references discovered" -> the warehouse never creates
        # Freight for it.
        discoveryLimit: 100
