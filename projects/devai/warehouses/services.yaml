---
# DevAI ships six images from the tesserix/devai monorepo (devai, devai-sre,
# devai-dashboard, devai-sre-dashboard, devai-auth-bff, devai-runner) plus
# agentic-registry from its own repo. All are PULLED at runtime from the GAR
# ghcr-remote mirror — never ghcr.io directly.
#
# Why we DISCOVER from git, not from image tags:
# Image `imageSelectionStrategy: NewestBuild` (and Lexical/Digest) all depend on
# the registry tag list. Once a repo accrues >100 tags, the registry paginates
# at 100 in an arbitrary order, so the newest main-<sha> often lands on page 2 —
# outside Kargo's discoveryLimit (hard-capped at 100). NewestBuild then never
# sees the newest build and silently promotes the newest of the stale page-1
# tags, flapping prod backwards (observed 2026-06-09: api stuck on main-1c11a22
# while HEAD was main-7a09b3e). This is the same class of bug stockpilot/scrapper
# hit; the fix is identical: subscribe to the git commit graph, which has a true
# order and no pagination. The prod Stage derives `main-<sha7>` from the commit.
#
# Path-filtered CI only builds the images whose sources changed, so the devai
# repo's `ensure-image-tags` workflow tags every image's :latest as main-<sha>
# on each push — guaranteeing the commit-derived tag resolves for ALL images.
# Images are still pulled from GAR; only the tag-derivation SOURCE changed.
apiVersion: kargo.akuity.io/v1alpha1
kind: Warehouse
metadata:
  name: services
spec:
  freightCreationPolicy: Automatic
  # Kargo normalizes durations to Go's canonical form (300s -> 5m0s); use the
  # normalized form so the Warehouse doesn't read perpetually OutOfSync.
  interval: 5m0s
  subscriptions:
    # Authoritative trigger: every new commit on tesserix/devai main becomes a
    # Freight. The prod Stage derives image.tag = main-<commit sha7> for all six
    # monorepo images. Commit-graph order is immune to the registry tag-list
    # pagination that broke image discovery.
    - git:
        repoURL: https://github.com/tesserix/devai.git
        # Watch `deploy`, NOT `main`. The `ensure-image-tags` CI job advances
        # `deploy` to a commit ONLY after every image's main-<sha> tag exists,
        # so Kargo can never promote a commit before its images are pullable.
        # Watching `main` directly raced: git-discovery promoted instantly, the
        # deploy pods pulled a not-yet-existing tag, and the GAR pull-through
        # negative-cached a 404 that stuck (ImagePullBackOff that never recovered).
        branch: deploy
        commitSelectionStrategy: NewestFromBranch
        discoveryLimit: 20

    # agentic-registry ships from its own repo (aregistry.tesserix.app, separate
    # from the devai monorepo). Kept on an IMAGE subscription — Kargo has no git
    # credentials for that repo, and it has few tags so the registry-tag
    # pagination that broke the devai images doesn't bite here. Single linux/amd64
    # manifest, so NO platform filter (it would match nothing on a non-index).
    - image:
        repoURL: asia-south1-docker.pkg.dev/tesseracthub-480811/ghcr-remote/tesserix/agentic-registry
        imageSelectionStrategy: NewestBuild
        allowTags: '^main-[a-f0-9]{7,12}$'
        strictSemvers: false
        discoveryLimit: 100
