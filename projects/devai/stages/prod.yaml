---
# Single prod Stage — auto-promotes Freight from the `services` Warehouse
# straight onto every DevAI ArgoCD Application, in lock-step.
#
# image.tag is derived from the source repo's newest commit (NOT imageFrom),
# because the GAR/ghcr tag list paginates at 100 and broke NewestBuild image
# discovery (see the warehouse for the incident note). CI tags every push to
# main as main-<sha7> (and `ensure-image-tags` backfills unchanged images), so
# resolving the tag from the commit ID yields the same image without the broken
# registry-tag discovery. Images are still PULLED from GAR (image.repository in
# each chart's values is the GAR mirror); only the tag SOURCE changed.
#
# Each ArgoCD Application carries kargo.akuity.io/authorized-stage: kargo-devai:prod.
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: prod
  annotations:
    kargo.akuity.io/color: '#5E35B1'
spec:
  requestedFreight:
    - origin:
        kind: Warehouse
        name: services
      sources:
        direct: true
  promotionTemplate:
    spec:
      vars:
        - name: argocdRepo
          value: https://github.com/tesserix/tesserix-k8s.git
        # main-<sha7> from the tesserix/devai HEAD commit — drives all six
        # monorepo images (api, mcp-hub, sre, dashboard, sre-dashboard,
        # auth-bff, runner).
        - name: imageTag
          value: main-${{ commitFrom("https://github.com/tesserix/devai.git").ID[0:7] }}
        # main-<sha7> from the agentic-registry HEAD commit.
        - name: registryTag
          value: main-${{ commitFrom("https://github.com/tesserix/agentic-registry.git").ID[0:7] }}
        # Full GAR ref for the runner image, tag derived from the devai commit,
        # so the K8s Job runner tracks HEAD dynamically (replaces the old static
        # pin in values-prod).
        - name: runnerImage
          value: asia-south1-docker.pkg.dev/tesseracthub-480811/ghcr-remote/tesserix/devai/devai-runner:main-${{ commitFrom("https://github.com/tesserix/devai.git").ID[0:7] }}

      steps:
        # ----- devai (ALM pipeline) + its K8s Job runner image -----
        - uses: argocd-update
          config:
            apps:
              - name: devai-api
                namespace: argocd
                sources:
                  - repoURL: ${{ vars.argocdRepo }}
                    helm:
                      images:
                        - key: image.tag
                          value: ${{ vars.imageTag }}
                        - key: k8sRuntime.runnerImage
                          value: ${{ vars.runnerImage }}

        # ----- devai-mcp-hub (runs the SAME devai image as devai-api) -----
        - uses: argocd-update
          config:
            apps:
              - name: devai-mcp-hub
                namespace: argocd
                sources:
                  - repoURL: ${{ vars.argocdRepo }}
                    helm:
                      images:
                        - key: image.tag
                          value: ${{ vars.imageTag }}

        # ----- devai-sre (autonomous scanner) -----
        - uses: argocd-update
          config:
            apps:
              - name: devai-sre
                namespace: argocd
                sources:
                  - repoURL: ${{ vars.argocdRepo }}
                    helm:
                      images:
                        - key: image.tag
                          value: ${{ vars.imageTag }}

        # ----- devai-dashboard (ALM UI) -----
        - uses: argocd-update
          config:
            apps:
              - name: devai-dashboard
                namespace: argocd
                sources:
                  - repoURL: ${{ vars.argocdRepo }}
                    helm:
                      images:
                        - key: image.tag
                          value: ${{ vars.imageTag }}

        # ----- devai-sre-dashboard (SRE UI) -----
        - uses: argocd-update
          config:
            apps:
              - name: devai-sre-dashboard
                namespace: argocd
                sources:
                  - repoURL: ${{ vars.argocdRepo }}
                    helm:
                      images:
                        - key: image.tag
                          value: ${{ vars.imageTag }}

        # ----- devai-auth-bff (GIP auth + reverse-proxy) -----
        - uses: argocd-update
          config:
            apps:
              - name: devai-auth-bff
                namespace: argocd
                sources:
                  - repoURL: ${{ vars.argocdRepo }}
                    helm:
                      images:
                        - key: image.tag
                          value: ${{ vars.imageTag }}

        # ----- agentic-registry (aregistry.tesserix.app) -----
        - uses: argocd-update
          config:
            apps:
              - name: agentic-registry
                namespace: argocd
                sources:
                  - repoURL: ${{ vars.argocdRepo }}
                    helm:
                      images:
                        - key: image.tag
                          value: ${{ vars.registryTag }}
