---
apiVersion: v1
kind: Namespace
metadata:
  name: kargo-scrapper
  labels:
    app.kubernetes.io/part-of: tesseract-platform
    app.kubernetes.io/component: release
    kargo.akuity.io/project: "true"
---
apiVersion: kargo.akuity.io/v1alpha1
kind: Project
metadata:
  name: kargo-scrapper
  annotations:
    kargo.akuity.io/description: |
      social-media-scrapper — Python FastAPI + Next.js + Postiz + Temporal,
      deployed at social-scrapper.tesserix.app.
      One-env (prod) deploy: image bumps land directly into the
      `scrapper` namespace via Argo CD Applications.
      postiz-app (third-party) and temporal (third-party) are NOT
      subscribed.
---
apiVersion: kargo.akuity.io/v1alpha1
kind: ProjectConfig
metadata:
  name: kargo-scrapper
  namespace: kargo-scrapper
spec:
  promotionPolicies:
    - stage: prod
      autoPromotionEnabled: true
