---
# scrapper-mcp uses the SAME image as scrapper-api (one Go binary,
# two K8s charts), so only TWO unique image subscriptions are needed.
# Both are multi-arch OCI image indexes, so `platform: linux/amd64`
# is REQUIRED (gotcha #10).
apiVersion: kargo.akuity.io/v1alpha1
kind: Warehouse
metadata:
  name: services
spec:
  freightCreationPolicy: Automatic
  interval: 300s
  subscriptions:
    - image:
        repoURL: asia-south1-docker.pkg.dev/tesseracthub-480811/ghcr-remote/tesserix/social-media-scrapper/scrapper-api
        imageSelectionStrategy: NewestBuild
        allowTags: '^main-[a-f0-9]{7,12}$'
        strictSemvers: false
        platform: linux/amd64
        discoveryLimit: 5
    - image:
        repoURL: asia-south1-docker.pkg.dev/tesseracthub-480811/ghcr-remote/tesserix/social-media-scrapper/scrapper-web
        imageSelectionStrategy: NewestBuild
        allowTags: '^main-[a-f0-9]{7,12}$'
        strictSemvers: false
        platform: linux/amd64
        discoveryLimit: 5
    # Track tesserix-k8s commits that touch this product's Helm chart
    # / values / ArgoCD Application YAML. Kargo emits a Freight on
    # every matching commit, the Stage promotes it, and ArgoCD's
    # auto-sync picks up the actual deploy. Kargo provides the audit
    # trail (which tesserix-k8s commit got promoted to prod, when).
    - git:
        repoURL: https://github.com/tesserix/tesserix-k8s.git
        branch: main
        # Mix of regex-style `.*` (works when Kargo treats includePaths
        # as Go regex) AND explicit literal yaml file paths (works in
        # both regex and glob matching modes — guaranteed-match for the
        # current ArgoCD Apps + chart values files). Other products
        # (fanzone, gameverse, homechef, etc.) get the literal match
        # via their `<product>-app-of-apps.yaml` files; scrapper +
        # stockpilot are nested under ai-apps/ with no per-product
        # parent so we list each child App directly.
        includePaths:
          - charts/apps/scrapper-.*
          - charts/apps/postsocial.*
          - argocd/prod/apps/ai-apps/scrapper-.*
          - argocd/prod/apps/ai-apps/postsocial.*
          - argocd/prod/apps/ai-apps/scrapper-api.yaml
          - argocd/prod/apps/ai-apps/scrapper-mcp.yaml
          - argocd/prod/apps/ai-apps/scrapper-web.yaml
          - argocd/prod/apps/ai-apps/scrapper-istio.yaml
          - argocd/prod/apps/ai-apps/scrapper-postgres.yaml
          - argocd/prod/apps/ai-apps/scrapper-db-schema-bootstrap.yaml
          - argocd/prod/apps/ai-apps/scrapper-identity-bootstrap.yaml
          - argocd/prod/apps/ai-apps/postsocial.yaml
          - argocd/prod/apps/ai-apps/postsocial-postgres.yaml
          - argocd/prod/apps/ai-apps/postsocial-redis.yaml
