---
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: prod
  annotations:
    kargo.akuity.io/color: '#F59E0B'
spec:
  requestedFreight:
    - origin:
        kind: Warehouse
        name: services
      sources:
        direct: true
  promotionTemplate:
    spec:
      vars:
        - name: argocdRepo
          value: https://github.com/tesserix/tesserix-k8s.git

      steps:
        # ----- gameverse-server -----
        - uses: argocd-update
          config:
            apps:
              - name: gameverse-server
                namespace: argocd
                sources:
                  - repoURL: ${{ vars.argocdRepo }}
                    helm:
                      images:
                        - key: image.tag
                          value: ${{ imageFrom("asia-south1-docker.pkg.dev/tesseracthub-480811/ghcr-remote/tesserix/gameverse-server").Tag }}

        # ----- gameverse-shell -----
        - uses: argocd-update
          config:
            apps:
              - name: gameverse-shell
                namespace: argocd
                sources:
                  - repoURL: ${{ vars.argocdRepo }}
                    helm:
                      images:
                        - key: image.tag
                          value: ${{ imageFrom("asia-south1-docker.pkg.dev/tesseracthub-480811/ghcr-remote/tesserix/gameverse-shell").Tag }}
