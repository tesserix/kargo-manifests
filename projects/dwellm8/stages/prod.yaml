---
# Single prod Stage — auto-promotes the newest main-<sha> image onto the
# `dwellm8-api` Argo CD Application's spec.source.helm.parameters.
#
# The Application carries
#   kargo.akuity.io/authorized-stage: kargo-dwellm8:prod
# without which Kargo refuses to mutate it.
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: prod
  annotations:
    kargo.akuity.io/color: '#14B8A6'
spec:
  requestedFreight:
    - origin:
        kind: Warehouse
        name: services
      sources:
        direct: true
  promotionTemplate:
    spec:
      vars:
        - name: argocdRepo
          value: https://github.com/tesserix/tesserix-k8s.git

      steps:
        - uses: argocd-update
          config:
            apps:
              - name: dwellm8-api
                namespace: argocd
                sources:
                  - repoURL: ${{ vars.argocdRepo }}
                    helm:
                      images:
                        - key: image.tag
                          value: ${{ imageFrom("asia-south1-docker.pkg.dev/tesseracthub-480811/ghcr-remote/tesserix/dwellm8/dwellm8-api").Tag }}
