---
# Single prod Stage — auto-promotes Freight from the bundled Warehouse
# straight onto every Tesserix Horoscope Argo CD Application, in
# lock-step.
#
# Each Argo CD Application has annotation
#   kargo.akuity.io/authorized-stage: kargo-horoscope:prod
# without which Kargo refuses to mutate it.
#
# The `argocd-update` step writes the new `image.tag` value into each
# Application's spec.source.helm.parameters list. ArgoCD's automated
# sync then rolls the Knative service.
#
# `imageFrom("<repoURL>")` pulls the matching image entry from the
# current Freight; `.Tag` returns the discovered tag (e.g.
# "main-4eb62b7").
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: prod
  annotations:
    kargo.akuity.io/color: '#C97A3D'
spec:
  requestedFreight:
    - origin:
        kind: Warehouse
        name: services
      sources:
        direct: true
  promotionTemplate:
    spec:
      vars:
        - name: argocdRepo
          value: https://github.com/tesserix/tesserix-k8s.git

      steps:
        # ----- horoscope-api -----
        - uses: argocd-update
          config:
            apps:
              - name: horoscope-api
                namespace: argocd
                sources:
                  - repoURL: ${{ vars.argocdRepo }}
                    helm:
                      images:
                        - key: image.tag
                          value: ${{ imageFrom("asia-south1-docker.pkg.dev/tesseracthub-480811/ghcr-remote/tesserix/tesserix-horoscope/horoscope-api").Tag }}

        # ----- horoscope-web -----
        - uses: argocd-update
          config:
            apps:
              - name: horoscope-web
                namespace: argocd
                sources:
                  - repoURL: ${{ vars.argocdRepo }}
                    helm:
                      images:
                        - key: image.tag
                          value: ${{ imageFrom("asia-south1-docker.pkg.dev/tesseracthub-480811/ghcr-remote/tesserix/tesserix-horoscope/horoscope-web").Tag }}
