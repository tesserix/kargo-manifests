---
# Tesserix Horoscope CI builds two services from the same monorepo
# (tesserix/tesserix-horoscope). Each image gets a `:main-<sha7>` tag
# on every push to main. We model the whole product as a SINGLE
# Warehouse with one image subscription per service — Kargo emits one
# Freight when ANY subscription sees a new tag, and that Freight
# references the latest tags across both services. The prod Stage
# promotes them as one bundle.
#
# Manifest type:
#   Both horoscope images are pushed via docker/build-push-action@v6
#   with no platforms argument, which produces a single linux/amd64
#   manifest (NOT an OCI image index). The `platform: linux/amd64`
#   filter is therefore optional but harmless — keeping it explicit
#   matches the homechef pattern and protects us if we later opt into
#   multi-arch builds.
apiVersion: kargo.akuity.io/v1alpha1
kind: Warehouse
metadata:
  name: services
spec:
  freightCreationPolicy: Automatic
  interval: 300s
  subscriptions:
    - image:
        repoURL: asia-south1-docker.pkg.dev/tesseracthub-480811/ghcr-remote/tesserix/tesserix-horoscope/horoscope-api
        imageSelectionStrategy: NewestBuild
        allowTags: '^main-[a-f0-9]{7,12}$'
        strictSemvers: false
        platform: linux/amd64
        discoveryLimit: 5
    - image:
        repoURL: asia-south1-docker.pkg.dev/tesseracthub-480811/ghcr-remote/tesserix/tesserix-horoscope/horoscope-web
        imageSelectionStrategy: NewestBuild
        allowTags: '^main-[a-f0-9]{7,12}$'
        strictSemvers: false
        platform: linux/amd64
        discoveryLimit: 5
    # Track tesserix-k8s commits that touch this product's Helm chart
    # / values / ArgoCD Application YAML. Kargo emits a Freight on
    # every matching commit, the Stage promotes it, and ArgoCD's
    # auto-sync picks up the actual deploy. Kargo provides the audit
    # trail (which tesserix-k8s commit got promoted to prod, when).
    - git:
        repoURL: https://github.com/tesserix/tesserix-k8s.git
        branch: main
        includePaths:
          - charts/apps/horoscope-.*
          - argocd/prod/apps/horoscope/.*
          - argocd/prod/apps/horoscope-app-of-apps.yaml
