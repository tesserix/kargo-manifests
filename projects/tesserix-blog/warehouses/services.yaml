---
# Single-image product — only the tesserix-blog Next.js app is
# Kargo-managed. mongodb-blog runs the upstream `mongo:7.0` image and
# isn't on a build pipeline.
#
# Manifest type: single-arch Docker v2 (verified via mediaType check
# on https://asia-south1-docker.pkg.dev/v2/.../tesserix-blog/manifests/main-<sha>),
# so the `platform:` filter is intentionally OMITTED — including it
# would silently drop every tag (Phase-1 retrospective gotcha #10).
apiVersion: kargo.akuity.io/v1alpha1
kind: Warehouse
metadata:
  name: services
spec:
  freightCreationPolicy: Automatic
  interval: 300s
  subscriptions:
    - image:
        repoURL: asia-south1-docker.pkg.dev/tesseracthub-480811/ghcr-remote/tesserix/tesserix-blog
        imageSelectionStrategy: NewestBuild
        allowTags: '^main-[a-f0-9]{7,12}$'
        strictSemvers: false
        discoveryLimit: 5
