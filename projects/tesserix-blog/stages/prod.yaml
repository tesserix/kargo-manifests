---
# Single prod Stage — auto-promotes the latest main-<sha7> tag onto
# the tesserix-blog Argo CD Application's spec.source.helm.parameters.
#
# The Application has annotation
#   kargo.akuity.io/authorized-stage: kargo-tesserix-blog:prod
# without which Kargo refuses to mutate it.
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: prod
  annotations:
    kargo.akuity.io/color: '#9333EA'
spec:
  requestedFreight:
    - origin:
        kind: Warehouse
        name: services
      sources:
        direct: true
  promotionTemplate:
    spec:
      vars:
        - name: argocdRepo
          value: https://github.com/tesserix/tesserix-k8s.git

      steps:
        - uses: argocd-update
          config:
            apps:
              - name: tesserix-blog
                namespace: argocd
                sources:
                  - repoURL: ${{ vars.argocdRepo }}
                    helm:
                      images:
                        - key: image.tag
                          value: ${{ imageFrom("asia-south1-docker.pkg.dev/tesseracthub-480811/ghcr-remote/tesserix/tesserix-blog").Tag }}
