---
# Promotes obs-api / obs-ui image tags into tesserix-k8s.
#
# Git write-back rather than the helm-parameter injection mark8ly uses.
# Two reasons:
#
#   1. The `prod-infrastructure` app-of-apps runs selfHeal: true WITHOUT
#      an ignoreDifferences entry for /spec/source/helm/parameters (the
#      mark8ly app-of-apps has one). Injected parameters would be reverted
#      on the next reconcile, leaving Kargo and ArgoCD fighting.
#   2. Every other stage in kargo-infra already writes back to Git, so the
#      promoted value is reviewable in history rather than living only in
#      a mutated live object.
#
# Writing `image.tag` also retires a real bug: the charts pulled the moving
# `:main` tag through the GAR pull-through mirror, and GAR only re-resolves
# a cached tag about every 30 minutes. A green build could therefore leave
# the previous digest serving with no signal that anything was stale.
# An immutable `main-<sha7>` in values.yaml cannot drift.
#
# Both target Applications carry
#   kargo.akuity.io/authorized-stage: "kargo-infra:observability-apps-prod"
# without which Kargo refuses to touch them.
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: observability-apps-prod
  namespace: kargo-infra
  annotations:
    kargo.akuity.io/color: '#3DA9E8'
spec:
  requestedFreight:
    - origin:
        kind: Warehouse
        name: observability-apps
      sources:
        direct: true
  promotionTemplate:
    spec:
      steps:
        - uses: git-clone
          config:
            repoURL: https://github.com/tesserix/tesserix-k8s.git
            checkout:
              - branch: main
                path: ./repo

        # Only image.tag moves. image.repository stays on the GAR mirror so
        # the pull still happens inside asia-south1 — Kargo discovers from
        # GHCR, the kubelet pulls from GAR, and the immutable tag means both
        # are talking about the same digest.
        - uses: yaml-update
          config:
            path: ./repo/charts/apps/obs-api/values.yaml
            updates:
              - key: image.tag
                value: ${{ imageFrom("ghcr.io/tesserix/observability/obs-api").Tag }}

        - uses: yaml-update
          config:
            path: ./repo/charts/apps/obs-ui/values.yaml
            updates:
              - key: image.tag
                value: ${{ imageFrom("ghcr.io/tesserix/observability/obs-ui").Tag }}

        - uses: git-commit
          config:
            path: ./repo
            message: "chore(observability): kargo promote obs-api/obs-ui to current freight"

        - uses: git-push
          as: push
          config:
            path: ./repo
            generateTargetBranch: true

        # main is protected. Use Kargo's generated promotion branch and merge
        # through a PR so every automated tag change remains reviewable.
        - uses: git-open-pr
          as: open-pr
          config:
            repoURL: https://github.com/tesserix/tesserix-k8s.git
            sourceBranch: ${{ outputs.push.branch }}
            targetBranch: main
            title: "chore(observability): promote current images"
            description: "Automated immutable image promotion from Kargo Freight."

        - uses: git-merge-pr
          as: merge-pr
          config:
            repoURL: https://github.com/tesserix/tesserix-k8s.git
            prNumber: ${{ outputs['open-pr'].pr.id }}
            mergeMethod: merge
            wait: true
            pollInterval: 15s

        # Sync immediately and block on convergence rather than waiting out
        # ArgoCD's poll interval.
        - uses: argocd-update
          as: argocd-update
          retry:
            timeout: 30m
            errorThreshold: 3
          config:
            apps:
              - name: obs-api
                namespace: argocd
                sources:
                  - repoURL: https://github.com/tesserix/tesserix-k8s.git
                    desiredRevision: ${{ outputs['merge-pr'].commit }}
              - name: obs-ui
                namespace: argocd
                sources:
                  - repoURL: https://github.com/tesserix/tesserix-k8s.git
                    desiredRevision: ${{ outputs['merge-pr'].commit }}
