# Reviewed changes open a PR; retries of already-reviewed Git skip empty proposals.
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: istio-prod
  namespace: kargo-infra
  annotations:
    kargo.akuity.io/color: '#476EAE'
spec:
  requestedFreight:
  - origin:
      kind: Warehouse
      name: istio
    sources:
      direct: true
  promotionTemplate:
    spec:
      steps:
      - uses: git-clone
        config:
          repoURL: https://github.com/tesserix/tesserix-k8s.git
          checkout:
          - branch: main
            path: ./repo
        as: clone
      - uses: yaml-update
        config:
          path: ./repo/argocd/prod/infrastructure/istio-base.yaml
          updates:
          - key: spec.source.targetRevision
            value: ${{ chartFrom("https://raw.githubusercontent.com/tesserix/tesserix-k8s/main/charts/thirdparty/istio-release", "base").Version }}
          - key: spec.source.repoURL
            value: https://raw.githubusercontent.com/tesserix/tesserix-k8s/main/charts/thirdparty/istio-release
      - uses: yaml-update
        config:
          path: ./repo/argocd/prod/infrastructure/istio-cni.yaml
          updates:
          - key: spec.source.targetRevision
            value: ${{ chartFrom("https://raw.githubusercontent.com/tesserix/tesserix-k8s/main/charts/thirdparty/istio-release", "cni").Version }}
          - key: spec.source.repoURL
            value: https://raw.githubusercontent.com/tesserix/tesserix-k8s/main/charts/thirdparty/istio-release
      - uses: yaml-update
        config:
          path: ./repo/argocd/prod/infrastructure/istio-istiod.yaml
          updates:
          - key: spec.source.targetRevision
            value: ${{ chartFrom("https://raw.githubusercontent.com/tesserix/tesserix-k8s/main/charts/thirdparty/istio-release", "istiod").Version }}
          - key: spec.source.repoURL
            value: https://raw.githubusercontent.com/tesserix/tesserix-k8s/main/charts/thirdparty/istio-release
      - uses: yaml-update
        config:
          path: ./repo/argocd/prod/infrastructure/istio-ztunnel.yaml
          updates:
          - key: spec.source.targetRevision
            value: ${{ chartFrom("https://raw.githubusercontent.com/tesserix/tesserix-k8s/main/charts/thirdparty/istio-release", "ztunnel").Version }}
          - key: spec.source.repoURL
            value: https://raw.githubusercontent.com/tesserix/tesserix-k8s/main/charts/thirdparty/istio-release
      - uses: yaml-update
        config:
          path: ./repo/argocd/prod/infrastructure/istio-egress-gateway.yaml
          updates:
          - key: spec.source.targetRevision
            value: ${{ chartFrom("https://raw.githubusercontent.com/tesserix/tesserix-k8s/main/charts/thirdparty/istio-release", "gateway").Version }}
          - key: spec.source.helm.valuesObject.podAnnotations.istioUpgradeVersion
            value: ${{ chartFrom("https://raw.githubusercontent.com/tesserix/tesserix-k8s/main/charts/thirdparty/istio-release", "gateway").Version }}
          - key: spec.source.repoURL
            value: https://raw.githubusercontent.com/tesserix/tesserix-k8s/main/charts/thirdparty/istio-release
      - uses: yaml-update
        config:
          path: ./repo/argocd/prod/infrastructure/istio-ingress-gateway-internal.yaml
          updates:
          - key: spec.source.targetRevision
            value: ${{ chartFrom("https://raw.githubusercontent.com/tesserix/tesserix-k8s/main/charts/thirdparty/istio-release", "gateway").Version }}
          - key: spec.source.helm.valuesObject.podAnnotations.istioUpgradeVersion
            value: ${{ chartFrom("https://raw.githubusercontent.com/tesserix/tesserix-k8s/main/charts/thirdparty/istio-release", "gateway").Version }}
          - key: spec.source.repoURL
            value: https://raw.githubusercontent.com/tesserix/tesserix-k8s/main/charts/thirdparty/istio-release
      - uses: yaml-update
        config:
          path: ./repo/argocd/prod/infrastructure/custom-ingress-gateway.yaml
          updates:
          - key: spec.source.targetRevision
            value: ${{ chartFrom("https://raw.githubusercontent.com/tesserix/tesserix-k8s/main/charts/thirdparty/istio-release", "gateway").Version }}
          - key: spec.source.helm.valuesObject.podAnnotations.istioUpgradeVersion
            value: ${{ chartFrom("https://raw.githubusercontent.com/tesserix/tesserix-k8s/main/charts/thirdparty/istio-release", "gateway").Version }}
          - key: spec.source.repoURL
            value: https://raw.githubusercontent.com/tesserix/tesserix-k8s/main/charts/thirdparty/istio-release
      - uses: yaml-update
        config:
          path: ./repo/argocd/prod/infrastructure/homechef-ingress-gateway.yaml
          updates:
          - key: spec.source.targetRevision
            value: ${{ chartFrom("https://raw.githubusercontent.com/tesserix/tesserix-k8s/main/charts/thirdparty/istio-release", "gateway").Version }}
          - key: spec.source.helm.valuesObject.podAnnotations.istioUpgradeVersion
            value: ${{ chartFrom("https://raw.githubusercontent.com/tesserix/tesserix-k8s/main/charts/thirdparty/istio-release", "gateway").Version }}
          - key: spec.source.repoURL
            value: https://raw.githubusercontent.com/tesserix/tesserix-k8s/main/charts/thirdparty/istio-release
      - uses: yaml-update
        config:
          path: ./repo/argocd/prod/infrastructure/zitadel-ingress-gateway.yaml
          updates:
          - key: spec.source.targetRevision
            value: ${{ chartFrom("https://raw.githubusercontent.com/tesserix/tesserix-k8s/main/charts/thirdparty/istio-release", "gateway").Version }}
          - key: spec.source.helm.valuesObject.podAnnotations.istioUpgradeVersion
            value: ${{ chartFrom("https://raw.githubusercontent.com/tesserix/tesserix-k8s/main/charts/thirdparty/istio-release", "gateway").Version }}
          - key: spec.source.repoURL
            value: https://raw.githubusercontent.com/tesserix/tesserix-k8s/main/charts/thirdparty/istio-release
      - uses: yaml-update
        config:
          path: ./repo/argocd/prod/infrastructure/istio-ingress-gateway.yaml
          updates:
          - key: spec.source.helm.valuesObject.podAnnotations.istioUpgradeVersion
            value: ${{ chartFrom("https://raw.githubusercontent.com/tesserix/tesserix-k8s/main/charts/thirdparty/istio-release", "gateway").Version }}
      - uses: git-commit
        config:
          path: ./repo
          message: 'chore(istio): kargo auto-upgrade to current freight'
        as: commit
      - uses: git-push
        as: push
        config:
          path: ./repo
          generateTargetBranch: true
        if: ${{ outputs.commit.commit != outputs.clone.commits['./repo'] }}
      - uses: git-open-pr
        as: open-pr
        config:
          repoURL: https://github.com/tesserix/tesserix-k8s.git
          sourceBranch: ${{ outputs.push.branch }}
          targetBranch: main
          title: 'chore(istio): propose reviewed mesh upgrade'
          description: Requires production rollout approval, compatibility review and required checks.
        if: ${{ outputs.commit.commit != outputs.clone.commits['./repo'] }}
      - uses: git-wait-for-pr
        retry:
          timeout: 168h
        config:
          repoURL: https://github.com/tesserix/tesserix-k8s.git
          prNumber: ${{ outputs['open-pr'].pr.id }}
        as: wait-for-pr
        if: ${{ outputs.commit.commit != outputs.clone.commits['./repo'] }}
      - uses: argocd-update
        retry:
          timeout: 30m
          errorThreshold: 30
        config:
          apps:
          - name: istio-base
            namespace: argocd
            sources:
            - repoURL: https://raw.githubusercontent.com/tesserix/tesserix-k8s/main/charts/thirdparty/istio-release
              updateTargetRevision: false
              chart: base
              desiredRevision: ${{ chartFrom("https://raw.githubusercontent.com/tesserix/tesserix-k8s/main/charts/thirdparty/istio-release", "base").Version }}
      - uses: argocd-wait
        retry:
          timeout: 30m
          errorThreshold: 3
        config:
          apps:
          - name: istio-base
            namespace: argocd
            waitFor:
            - health
            - sync
            - operation
      - uses: argocd-update
        retry:
          timeout: 30m
          errorThreshold: 30
        config:
          apps:
          - name: istio-istiod
            namespace: argocd
            sources:
            - repoURL: https://raw.githubusercontent.com/tesserix/tesserix-k8s/main/charts/thirdparty/istio-release
              updateTargetRevision: false
              chart: istiod
              desiredRevision: ${{ chartFrom("https://raw.githubusercontent.com/tesserix/tesserix-k8s/main/charts/thirdparty/istio-release", "istiod").Version }}
      - uses: argocd-wait
        retry:
          timeout: 30m
          errorThreshold: 3
        config:
          apps:
          - name: istio-istiod
            namespace: argocd
            waitFor:
            - health
            - sync
            - operation
      - uses: argocd-update
        retry:
          timeout: 30m
          errorThreshold: 30
        config:
          apps:
          - name: istio-cni
            namespace: argocd
            sources:
            - repoURL: https://raw.githubusercontent.com/tesserix/tesserix-k8s/main/charts/thirdparty/istio-release
              updateTargetRevision: false
              chart: cni
              desiredRevision: ${{ chartFrom("https://raw.githubusercontent.com/tesserix/tesserix-k8s/main/charts/thirdparty/istio-release", "cni").Version }}
      - uses: argocd-wait
        retry:
          timeout: 30m
          errorThreshold: 3
        config:
          apps:
          - name: istio-cni
            namespace: argocd
            waitFor:
            - health
            - sync
            - operation
      - uses: argocd-update
        retry:
          timeout: 30m
          errorThreshold: 30
        config:
          apps:
          - name: istio-ztunnel
            namespace: argocd
            sources:
            - repoURL: https://raw.githubusercontent.com/tesserix/tesserix-k8s/main/charts/thirdparty/istio-release
              updateTargetRevision: false
              chart: ztunnel
              desiredRevision: ${{ chartFrom("https://raw.githubusercontent.com/tesserix/tesserix-k8s/main/charts/thirdparty/istio-release", "ztunnel").Version }}
      - uses: argocd-wait
        retry:
          timeout: 30m
          errorThreshold: 3
        config:
          apps:
          - name: istio-ztunnel
            namespace: argocd
            waitFor:
            - health
            - sync
            - operation
      - uses: argocd-update
        retry:
          timeout: 30m
          errorThreshold: 30
        config:
          apps:
          - name: istio-egress-gateway
            namespace: argocd
            sources:
            - repoURL: https://raw.githubusercontent.com/tesserix/tesserix-k8s/main/charts/thirdparty/istio-release
              updateTargetRevision: false
              chart: gateway
              desiredRevision: ${{ chartFrom("https://raw.githubusercontent.com/tesserix/tesserix-k8s/main/charts/thirdparty/istio-release", "gateway").Version }}
          - name: istio-ingress-gateway
            namespace: argocd
            sources:
            - repoURL: https://github.com/tesserix/tesserix-k8s.git
              updateTargetRevision: false
              desiredRevision: '${{ outputs.commit.commit == outputs.clone.commits[''./repo''] ? outputs.commit.commit : outputs[''wait-for-pr''].commit }}'
          - name: istio-ingress-gateway-internal
            namespace: argocd
            sources:
            - repoURL: https://raw.githubusercontent.com/tesserix/tesserix-k8s/main/charts/thirdparty/istio-release
              updateTargetRevision: false
              chart: gateway
              desiredRevision: ${{ chartFrom("https://raw.githubusercontent.com/tesserix/tesserix-k8s/main/charts/thirdparty/istio-release", "gateway").Version }}
          - name: custom-ingress-gateway
            namespace: argocd
            sources:
            - repoURL: https://raw.githubusercontent.com/tesserix/tesserix-k8s/main/charts/thirdparty/istio-release
              updateTargetRevision: false
              chart: gateway
              desiredRevision: ${{ chartFrom("https://raw.githubusercontent.com/tesserix/tesserix-k8s/main/charts/thirdparty/istio-release", "gateway").Version }}
          - name: homechef-ingress-gateway
            namespace: argocd
            sources:
            - repoURL: https://raw.githubusercontent.com/tesserix/tesserix-k8s/main/charts/thirdparty/istio-release
              updateTargetRevision: false
              chart: gateway
              desiredRevision: ${{ chartFrom("https://raw.githubusercontent.com/tesserix/tesserix-k8s/main/charts/thirdparty/istio-release", "gateway").Version }}
          - name: zitadel-ingress-gateway
            namespace: argocd
            sources:
            - repoURL: https://raw.githubusercontent.com/tesserix/tesserix-k8s/main/charts/thirdparty/istio-release
              updateTargetRevision: false
              chart: gateway
              desiredRevision: ${{ chartFrom("https://raw.githubusercontent.com/tesserix/tesserix-k8s/main/charts/thirdparty/istio-release", "gateway").Version }}
      - uses: argocd-wait
        retry:
          timeout: 30m
          errorThreshold: 3
        config:
          apps:
          - name: istio-egress-gateway
            namespace: argocd
            waitFor:
            - health
            - sync
            - operation
          - name: istio-ingress-gateway
            namespace: argocd
            waitFor:
            - health
            - sync
            - operation
          - name: istio-ingress-gateway-internal
            namespace: argocd
            waitFor:
            - health
            - sync
            - operation
          - name: custom-ingress-gateway
            namespace: argocd
            waitFor:
            - health
            - sync
            - operation
          - name: homechef-ingress-gateway
            namespace: argocd
            waitFor:
            - health
            - sync
            - operation
          - name: zitadel-ingress-gateway
            namespace: argocd
            waitFor:
            - health
            - sync
            - operation
