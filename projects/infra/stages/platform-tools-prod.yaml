---
# Self-managing tier: a promotion here can roll Kargo itself and ArgoCD
# itself. Both tolerate being upgraded by the very sync they trigger —
# controllers resume reconciliation after restart.
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: platform-tools-prod
  namespace: kargo-infra
  annotations:
    kargo.akuity.io/color: '#5AB552'
spec:
  requestedFreight:
    - origin:
        kind: Warehouse
        name: platform-tools
      sources:
        direct: true
  promotionTemplate:
    spec:
      steps:
        - uses: argocd-update
          config:
            apps:
              - name: kargo
                namespace: argocd
                sources:
                  - repoURL: ghcr.io/akuity/kargo-charts
                    chart: kargo
                    desiredRevision: ${{ chartFrom("oci://ghcr.io/akuity/kargo-charts/kargo").Version }}
              - name: keda
                namespace: argocd
                sources:
                  - repoURL: https://kedacore.github.io/charts
                    chart: keda
                    desiredRevision: ${{ chartFrom("https://kedacore.github.io/charts", "keda").Version }}
              - name: cert-manager
                namespace: argocd
                sources:
                  - repoURL: https://charts.jetstack.io
                    chart: cert-manager
                    desiredRevision: ${{ chartFrom("https://charts.jetstack.io", "cert-manager").Version }}
              - name: argocd
                namespace: argocd
                sources:
                  - repoURL: https://argoproj.github.io/argo-helm
                    chart: argo-cd
                    desiredRevision: ${{ chartFrom("https://argoproj.github.io/argo-helm", "argo-cd").Version }}
              - name: sealed-secrets
                namespace: argocd
                sources:
                  - repoURL: https://bitnami-labs.github.io/sealed-secrets
                    chart: sealed-secrets
                    desiredRevision: ${{ chartFrom("https://bitnami-labs.github.io/sealed-secrets", "sealed-secrets").Version }}
              - name: reloader
                namespace: argocd
                sources:
                  - repoURL: https://stakater.github.io/stakater-charts
                    chart: reloader
                    desiredRevision: ${{ chartFrom("https://stakater.github.io/stakater-charts", "reloader").Version }}
              - name: external-dns
                namespace: argocd
                sources:
                  - repoURL: https://kubernetes-sigs.github.io/external-dns
                    chart: external-dns
                    desiredRevision: ${{ chartFrom("https://kubernetes-sigs.github.io/external-dns", "external-dns").Version }}
              - name: arc-controller
                namespace: argocd
                sources:
                  - repoURL: ghcr.io/actions/actions-runner-controller-charts
                    chart: gha-runner-scale-set-controller
                    desiredRevision: ${{ chartFrom("oci://ghcr.io/actions/actions-runner-controller-charts/gha-runner-scale-set-controller").Version }}
              - name: arc-runner-scale-set
                namespace: argocd
                sources:
                  - repoURL: ghcr.io/actions/actions-runner-controller-charts
                    chart: gha-runner-scale-set
                    desiredRevision: ${{ chartFrom("oci://ghcr.io/actions/actions-runner-controller-charts/gha-runner-scale-set").Version }}
              - name: agentgateway
                namespace: argocd
                sources:
                  - repoURL: ghcr.io/agentgateway/agentgateway/charts
                    chart: agentgateway
                    desiredRevision: ${{ chartFrom("oci://ghcr.io/agentgateway/agentgateway/charts/agentgateway").Version }}
              - name: agentgateway-crds
                namespace: argocd
                sources:
                  - repoURL: ghcr.io/agentgateway/agentgateway/charts
                    chart: agentgateway-crds
                    desiredRevision: ${{ chartFrom("oci://ghcr.io/agentgateway/agentgateway/charts/agentgateway-crds").Version }}
              - name: kagent
                namespace: argocd
                sources:
                  - repoURL: ghcr.io/kagent-dev/kagent/helm
                    chart: kagent
                    desiredRevision: ${{ chartFrom("oci://ghcr.io/kagent-dev/kagent/helm/kagent").Version }}
              - name: kagent-crds
                namespace: argocd
                sources:
                  - repoURL: ghcr.io/kagent-dev/kagent/helm
                    chart: kagent-crds
                    desiredRevision: ${{ chartFrom("oci://ghcr.io/kagent-dev/kagent/helm/kagent-crds").Version }}
