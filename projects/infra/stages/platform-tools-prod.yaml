---
# Git write-back upgrades for platform tooling — including Kargo
# itself and the self-managed ArgoCD.
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: platform-tools-prod
  namespace: kargo-infra
  annotations:
    kargo.akuity.io/color: '#5AB552'
spec:
  requestedFreight:
    - origin:
        kind: Warehouse
        name: platform-tools
      sources:
        direct: true
  promotionTemplate:
    spec:
      steps:
        - uses: git-clone
          config:
            repoURL: https://github.com/tesserix/tesserix-k8s.git
            checkout:
              - branch: main
                path: ./repo
        - uses: yaml-update
          config:
            path: ./repo/argocd/prod/infrastructure/kargo.yaml
            updates:
              - key: spec.source.targetRevision
                value: ${{ chartFrom("oci://ghcr.io/akuity/kargo-charts/kargo").Version }}
        - uses: yaml-update
          config:
            path: ./repo/argocd/prod/infrastructure/keda.yaml
            updates:
              - key: spec.source.targetRevision
                value: ${{ chartFrom("https://kedacore.github.io/charts", "keda").Version }}
        - uses: yaml-update
          config:
            path: ./repo/argocd/prod/infrastructure/cert-manager.yaml
            updates:
              - key: spec.source.targetRevision
                value: ${{ chartFrom("https://charts.jetstack.io", "cert-manager").Version }}
        - uses: yaml-update
          config:
            path: ./repo/argocd/prod/infrastructure/argocd.yaml
            updates:
              - key: spec.source.targetRevision
                value: ${{ chartFrom("https://argoproj.github.io/argo-helm", "argo-cd").Version }}
        - uses: yaml-update
          config:
            path: ./repo/argocd/prod/infrastructure/sealed-secrets.yaml
            updates:
              - key: spec.source.targetRevision
                value: ${{ chartFrom("https://bitnami.github.io/sealed-secrets", "sealed-secrets").Version }}
        - uses: yaml-update
          config:
            path: ./repo/argocd/prod/infrastructure/reloader.yaml
            updates:
              - key: spec.source.targetRevision
                value: ${{ chartFrom("https://stakater.github.io/stakater-charts", "reloader").Version }}
        - uses: yaml-update
          config:
            path: ./repo/argocd/prod/infrastructure/external-dns.yaml
            updates:
              - key: spec.source.targetRevision
                value: ${{ chartFrom("https://kubernetes-sigs.github.io/external-dns", "external-dns").Version }}
        - uses: yaml-update
          config:
            path: ./repo/argocd/prod/infrastructure/arc-controller.yaml
            updates:
              - key: spec.source.targetRevision
                value: ${{ chartFrom("oci://ghcr.io/actions/actions-runner-controller-charts/gha-runner-scale-set-controller").Version }}
        - uses: yaml-update
          config:
            path: ./repo/argocd/prod/infrastructure/arc-runner-scale-set.yaml
            updates:
              - key: spec.source.targetRevision
                value: ${{ chartFrom("oci://ghcr.io/actions/actions-runner-controller-charts/gha-runner-scale-set").Version }}
        - uses: yaml-update
          config:
            path: ./repo/argocd/prod/infrastructure/agentgateway.yaml
            updates:
              - key: spec.source.targetRevision
                value: ${{ chartFrom("oci://ghcr.io/agentgateway/agentgateway/charts/agentgateway").Version }}
        - uses: yaml-update
          config:
            path: ./repo/argocd/prod/infrastructure/agentgateway-crds.yaml
            updates:
              - key: spec.source.targetRevision
                value: ${{ chartFrom("oci://ghcr.io/agentgateway/agentgateway/charts/agentgateway-crds").Version }}
        - uses: yaml-update
          config:
            path: ./repo/argocd/prod/infrastructure/kagent.yaml
            updates:
              - key: spec.source.targetRevision
                value: ${{ chartFrom("oci://ghcr.io/kagent-dev/kagent/helm/kagent").Version }}
        - uses: yaml-update
          config:
            path: ./repo/argocd/prod/infrastructure/kagent-crds.yaml
            updates:
              - key: spec.source.targetRevision
                value: ${{ chartFrom("oci://ghcr.io/kagent-dev/kagent/helm/kagent-crds").Version }}
        - uses: git-commit
          config:
            path: ./repo
            message: "chore(platform-tools): kargo auto-upgrade to current freight"
        - uses: git-push
          config:
            path: ./repo
        # Trigger immediate syncs and wait for convergence instead of
        # relying on ArgoCD's poll interval.
        - uses: argocd-update
          retry:
            timeout: 30m
            errorThreshold: 3
          config:
            apps:
              - name: kargo
                namespace: argocd
              - name: keda
                namespace: argocd
              - name: cert-manager
                namespace: argocd
              - name: argocd
                namespace: argocd
              - name: sealed-secrets
                namespace: argocd
              - name: reloader
                namespace: argocd
              - name: external-dns
                namespace: argocd
              - name: arc-controller
                namespace: argocd
              - name: arc-runner-scale-set
                namespace: argocd
              - name: agentgateway
                namespace: argocd
              - name: agentgateway-crds
                namespace: argocd
              - name: kagent
                namespace: argocd
              - name: kagent-crds
                namespace: argocd
