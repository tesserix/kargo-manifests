---
# Git write-back upgrades for the observability stack.
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: observability-prod
  namespace: kargo-infra
  annotations:
    kargo.akuity.io/color: '#E8A33D'
spec:
  requestedFreight:
    - origin:
        kind: Warehouse
        name: observability
      sources:
        direct: true
  promotionTemplate:
    spec:
      steps:
        - uses: git-clone
          config:
            repoURL: https://github.com/tesserix/tesserix-k8s.git
            checkout:
              - branch: main
                path: ./repo
        - uses: yaml-update
          config:
            path: ./repo/argocd/prod/infrastructure/grafana.yaml
            updates:
              - key: spec.source.targetRevision
                value: ${{ chartFrom("https://grafana.github.io/helm-charts", "grafana").Version }}
        - uses: yaml-update
          config:
            path: ./repo/argocd/prod/infrastructure/prometheus.yaml
            updates:
              - key: spec.source.targetRevision
                value: ${{ chartFrom("https://prometheus-community.github.io/helm-charts", "prometheus").Version }}
        - uses: yaml-update
          config:
            path: ./repo/argocd/prod/infrastructure/prometheus-operator-crds.yaml
            updates:
              - key: spec.source.targetRevision
                value: ${{ chartFrom("https://prometheus-community.github.io/helm-charts", "prometheus-operator-crds").Version }}
        - uses: yaml-update
          config:
            path: ./repo/argocd/prod/infrastructure/kiali.yaml
            updates:
              - key: spec.source.targetRevision
                value: ${{ chartFrom("https://kiali.org/helm-charts", "kiali-server").Version }}
        - uses: git-commit
          config:
            path: ./repo
            message: "chore(observability): kargo auto-upgrade to current freight"
        - uses: git-push
          config:
            path: ./repo
        # Trigger immediate syncs and wait for convergence instead of
        # relying on ArgoCD's poll interval.
        - uses: argocd-update
          retry:
            timeout: 30m
            errorThreshold: 3
          config:
            apps:
              - name: grafana
                namespace: argocd
              - name: prometheus
                namespace: argocd
              - name: prometheus-operator-crds
                namespace: argocd
              - name: kiali
                namespace: argocd
