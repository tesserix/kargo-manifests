apiVersion: kargo.akuity.io/v1alpha1
kind: Promotion
metadata:
  namespace: kargo-infra
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
    argocd.argoproj.io/hook: Sync
  generateName: helivanta-growthbook-bootstrap-
spec:
  stage: helivanta-growthbook-prod
  freight: 8006e0409c0b829cfebbad10e9366273a67b52d3
  steps:
  - uses: git-clone
    as: clone
    config:
      repoURL: https://github.com/tesserix/tesserix-k8s.git
      checkout:
      - branch: main
        path: ./repo
  - uses: yaml-update
    config:
      path: ./repo/argocd/prod/apps/helivanta/helivanta-growthbook.yaml
      updates:
      - key: spec.source.helm.parameters.0.value
        value: ${{ imageFrom("docker.io/growthbook/growthbook").Tag }}
      - key: spec.source.helm.parameters.1.value
        value: ${{ imageFrom("docker.io/growthbook/growthbook").Digest }}
  - uses: git-commit
    as: commit
    config:
      path: ./repo
      message: 'chore(helivanta-growthbook): pin verified Kargo freight'
  - uses: git-push
    as: push
    if: ${{ outputs.commit.commit != outputs.clone.commits['./repo'] }}
    config:
      path: ./repo
      generateTargetBranch: true
  - uses: git-open-pr
    as: open-pr
    if: ${{ outputs.commit.commit != outputs.clone.commits['./repo'] }}
    config:
      repoURL: https://github.com/tesserix/tesserix-k8s.git
      sourceBranch: ${{ outputs.push.branch }}
      targetBranch: main
      title: 'chore(helivanta-growthbook): promote pinned dedicated provider release'
      description: Pin the stable GrowthBook version and immutable digest from Kargo Freight. Review release compatibility,
        backup/restore and SDK verification evidence before merging. No MongoDB or shared feature configuration is changed.
        Kargo waits for merge and Argo health.
  - uses: git-wait-for-pr
    as: wait-for-pr
    if: ${{ outputs.commit.commit != outputs.clone.commits['./repo'] }}
    config:
      repoURL: https://github.com/tesserix/tesserix-k8s.git
      prNumber: ${{ outputs['open-pr'].pr.id }}
  - uses: argocd-update
    retry:
      timeout: 30m
      errorThreshold: 30
    config:
      apps:
      - name: helivanta-growthbook
        namespace: argocd
        sources:
        - repoURL: https://github.com/tesserix/tesserix-k8s.git
          desiredRevision: '${{ outputs.commit.commit == outputs.clone.commits[''./repo''] ? outputs.commit.commit : outputs[''wait-for-pr''].commit
            }}'
  - uses: argocd-wait
    config:
      apps:
      - name: helivanta-growthbook
        namespace: argocd
        waitFor:
        - health
        - sync
        - operation
