---
apiVersion: kargo.akuity.io/v1alpha1
kind: Warehouse
metadata:
  name: growthbook
  namespace: kargo-infra
spec:
  freightCreationPolicy: Automatic
  interval: 1h0m0s
  subscriptions:
    - image:
        repoURL: docker.io/growthbook/growthbook
        imageSelectionStrategy: SemVer
        semverConstraint: ">=5.2.0 <5.3.0"
        allowTagsRegexes:
          - '^[0-9]+\.[0-9]+\.[0-9]+$'
        platform: linux/amd64
        discoveryLimit: 20
