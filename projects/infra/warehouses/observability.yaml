---
# Observability stack — same-major auto-upgrades.
# elasticsearch/kibana are EXCLUDED: the elastic chart line is EOL'd at
# 8.5.1 (no upgrade will ever arrive) and the adopted elasticsearch
# StatefulSet carries immutable-field drift that fails ArgoCD sync —
# including them only blocks promotions of charts that DO move.
apiVersion: kargo.akuity.io/v1alpha1
kind: Warehouse
metadata:
  name: observability
  namespace: kargo-infra
spec:
  freightCreationPolicy: Automatic
  interval: 1h0m0s
  subscriptions:
    - chart:
        repoURL: https://grafana.github.io/helm-charts
        name: grafana
        semverConstraint: ">=8.5.2 <9.0.0"
    - chart:
        repoURL: https://prometheus-community.github.io/helm-charts
        name: prometheus
        semverConstraint: ">=25.27.0 <26.0.0"
    - chart:
        repoURL: https://prometheus-community.github.io/helm-charts
        name: prometheus-operator-crds
        semverConstraint: ">=18.0.1 <19.0.0"
    - chart:
        repoURL: https://fluent.github.io/helm-charts
        name: fluent-bit
        semverConstraint: ">=0.47.10 <1.0.0"
    - chart:
        repoURL: https://kiali.org/helm-charts
        name: kiali-server
        semverConstraint: ">=2.1.0 <3.0.0"
