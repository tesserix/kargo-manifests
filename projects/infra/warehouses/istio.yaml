# Discover only patched 1.31 releases. Production promotion remains manual.
apiVersion: kargo.akuity.io/v1alpha1
kind: Warehouse
metadata:
  name: istio
  namespace: kargo-infra
spec:
  freightCreationPolicy: Automatic
  interval: 1h0m0s
  subscriptions:
    - chart:
        repoURL: https://raw.githubusercontent.com/tesserix/tesserix-k8s/main/charts/thirdparty/istio-release
        name: base
        semverConstraint: ">=1.31.4 <1.32.0"
    - chart:
        repoURL: https://raw.githubusercontent.com/tesserix/tesserix-k8s/main/charts/thirdparty/istio-release
        name: cni
        semverConstraint: ">=1.31.4 <1.32.0"
    - chart:
        repoURL: https://raw.githubusercontent.com/tesserix/tesserix-k8s/main/charts/thirdparty/istio-release
        name: istiod
        semverConstraint: ">=1.31.4 <1.32.0"
    - chart:
        repoURL: https://raw.githubusercontent.com/tesserix/tesserix-k8s/main/charts/thirdparty/istio-release
        name: ztunnel
        semverConstraint: ">=1.31.4 <1.32.0"
    - chart:
        repoURL: https://raw.githubusercontent.com/tesserix/tesserix-k8s/main/charts/thirdparty/istio-release
        name: gateway
        semverConstraint: ">=1.31.4 <1.32.0"
