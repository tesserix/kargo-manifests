# Discover only patched 1.31 releases. Production promotion remains manual.
apiVersion: kargo.akuity.io/v1alpha1
kind: Warehouse
metadata:
  name: istio
  namespace: kargo-infra
spec:
  freightCreationPolicy: Automatic
  interval: 1h0m0s
  subscriptions:
    - chart:
        repoURL: https://istio-release.storage.googleapis.com/charts
        name: base
        semverConstraint: ">=1.31.4 <1.32.0"
    - chart:
        repoURL: https://istio-release.storage.googleapis.com/charts
        name: cni
        semverConstraint: ">=1.31.4 <1.32.0"
    - chart:
        repoURL: https://istio-release.storage.googleapis.com/charts
        name: istiod
        semverConstraint: ">=1.31.4 <1.32.0"
    - chart:
        repoURL: https://istio-release.storage.googleapis.com/charts
        name: ztunnel
        semverConstraint: ">=1.31.4 <1.32.0"
    - chart:
        repoURL: https://istio-release.storage.googleapis.com/charts
        name: gateway
        semverConstraint: ">=1.31.4 <1.32.0"
