---
# OpenBao — the cluster's secret store. Its own warehouse, not a subscription
# on `platform-tools`, for the reason observability-apps was split out: a
# Warehouse emits ONE Freight covering all its subscriptions, so folding
# OpenBao in would let a stuck cert-manager upgrade block a security patch to
# the secret store, and vice versa.
#
# Two subscriptions because the chart and the binary release on separate
# cadences: openbao-helm ships packaging fixes without a new OpenBao, and
# OpenBao ships CVE patches without a new chart. The stage writes both.
#
# GUARDRAILS. Auto-promotion here upgrades the component every ExternalSecret
# in the cluster depends on, so the ranges are deliberately tight:
#   - chart pinned to the CURRENT MINOR (0.29.x). openbao-helm is 0.x, where
#     minors are semver-breaking — 0.28 -> 0.29 moved values under `server.`.
#   - image pinned to the current MAJOR. OpenBao 2.x -> 3.x will change the
#     storage format; a raft migration is not something to wake up to.
# Widening either range is deliberate human work.
apiVersion: kargo.akuity.io/v1alpha1
kind: Warehouse
metadata:
  name: openbao
  namespace: kargo-infra
spec:
  freightCreationPolicy: Automatic
  interval: 1h0m0s
  subscriptions:
    - chart:
        repoURL: https://openbao.github.io/openbao-helm
        name: openbao
        semverConstraint: ">=0.29.1 <0.30.0"
        discoveryLimit: 20
    # quay.io publishes bare semver (`2.6.1`) alongside floating `2.6`, `2`
    # and `latest`, plus per-arch `2.5.5-arm64` tags that parse as
    # prereleases. Only the three-part form is allowed through.
    - image:
        repoURL: quay.io/openbao/openbao
        imageSelectionStrategy: SemVer
        semverConstraint: ">=2.6.1 <3.0.0"
        allowTagsRegexes:
          - '^[0-9]+\.[0-9]+\.[0-9]+$'
        platform: linux/amd64
        discoveryLimit: 20
