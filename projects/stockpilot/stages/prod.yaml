---
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: prod
  annotations:
    kargo.akuity.io/color: '#3B82F6'
spec:
  requestedFreight:
    - origin:
        kind: Warehouse
        name: services
      sources:
        direct: true
  promotionTemplate:
    spec:
      vars:
        - name: argocdRepo
          value: https://github.com/tesserix/tesserix-k8s.git
        # `image.tag` is derived from the source app repo's newest
        # commit on main, NOT from `imageFrom(...).Tag`. The GAR
        # ghcr-remote mirror's CREATE_TIME is bumped on every pull, so
        # NewestBuild image discovery silently regresses (see the
        # warehouse for the full incident note). The CI workflow tags
        # every push to main as `main-<sha7>`, so resolving the tag
        # from the commit ID gives the same image without going
        # through the broken mirror discovery.
        - name: imageTag
          value: main-${{ commitFrom("https://github.com/tesserix/stock-analysis.git").ID[0:7] }}

      steps:
        # ----- stockpilot-api -----
        - uses: argocd-update
          config:
            apps:
              - name: stockpilot-api
                namespace: argocd
                sources:
                  - repoURL: ${{ vars.argocdRepo }}
                    helm:
                      images:
                        - key: image.tag
                          value: ${{ vars.imageTag }}

        # ----- stockpilot-worker (same image as stockpilot-api) -----
        - uses: argocd-update
          config:
            apps:
              - name: stockpilot-worker
                namespace: argocd
                sources:
                  - repoURL: ${{ vars.argocdRepo }}
                    helm:
                      images:
                        - key: image.tag
                          value: ${{ vars.imageTag }}

        # ----- stockpilot-web -----
        - uses: argocd-update
          config:
            apps:
              - name: stockpilot-web
                namespace: argocd
                sources:
                  - repoURL: ${{ vars.argocdRepo }}
                    helm:
                      images:
                        - key: image.tag
                          value: ${{ vars.imageTag }}
