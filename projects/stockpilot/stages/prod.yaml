---
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: prod
  annotations:
    kargo.akuity.io/color: '#3B82F6'
spec:
  requestedFreight:
    - origin:
        kind: Warehouse
        name: services
      sources:
        direct: true
  promotionTemplate:
    spec:
      vars:
        - name: argocdRepo
          value: https://github.com/tesserix/tesserix-k8s.git

      steps:
        # ----- stockpilot-api -----
        - uses: argocd-update
          config:
            apps:
              - name: stockpilot-api
                namespace: argocd
                sources:
                  - repoURL: ${{ vars.argocdRepo }}
                    helm:
                      images:
                        - key: image.tag
                          value: ${{ imageFrom("asia-south1-docker.pkg.dev/tesseracthub-480811/ghcr-remote/tesserix/stock-analysis/stockpilot-api").Tag }}

        # ----- stockpilot-worker (same image as stockpilot-api) -----
        - uses: argocd-update
          config:
            apps:
              - name: stockpilot-worker
                namespace: argocd
                sources:
                  - repoURL: ${{ vars.argocdRepo }}
                    helm:
                      images:
                        - key: image.tag
                          value: ${{ imageFrom("asia-south1-docker.pkg.dev/tesseracthub-480811/ghcr-remote/tesserix/stock-analysis/stockpilot-api").Tag }}

        # ----- stockpilot-web -----
        - uses: argocd-update
          config:
            apps:
              - name: stockpilot-web
                namespace: argocd
                sources:
                  - repoURL: ${{ vars.argocdRepo }}
                    helm:
                      images:
                        - key: image.tag
                          value: ${{ imageFrom("asia-south1-docker.pkg.dev/tesseracthub-480811/ghcr-remote/tesserix/stock-analysis/stockpilot-web").Tag }}
