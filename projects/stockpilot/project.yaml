---
apiVersion: v1
kind: Namespace
metadata:
  name: kargo-stockpilot
  labels:
    app.kubernetes.io/part-of: tesseract-platform
    app.kubernetes.io/component: release
    kargo.akuity.io/project: "true"
---
apiVersion: kargo.akuity.io/v1alpha1
kind: Project
metadata:
  name: kargo-stockpilot
  annotations:
    kargo.akuity.io/description: |
      stockpilot — Python LangGraph stock-analysis platform with
      Next.js web at stockpilot.tesserix.app.
      One-env (prod) deploy. Replaces the previous bump-k8s
      auto-deploy job that committed image.tag changes to
      tesserix-k8s/charts/apps/stockpilot-{api,web,worker}/values-prod.yaml.
      Third-party images (Ollama for fingpt-inference, openbb-api
      upstream) are NOT subscribed.
---
apiVersion: kargo.akuity.io/v1alpha1
kind: ProjectConfig
metadata:
  name: kargo-stockpilot
  namespace: kargo-stockpilot
spec:
  promotionPolicies:
    # Auto-promotion is OFF because the GAR ghcr-remote mirror reports a
    # CREATE_TIME that gets bumped every time a pod re-pulls an image —
    # so the currently-deployed tag keeps re-appearing as "newest" under
    # `imageSelectionStrategy: NewestBuild`. Result: each auto-promotion
    # regressed to whichever image GAR most-recently re-cached. See the
    # TODO in warehouses/services.yaml for the full context and the
    # paths to a permanent fix (subscribe to ghcr.io directly, or add a
    # git subscription on the source repo).
    #
    # While this is `false`, deploy via Kargo UI: pick the freight whose
    # api/web tags match the commit you want shipped, hit Promote.
    - stage: prod
      autoPromotionEnabled: false
