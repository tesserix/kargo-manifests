---
# stockpilot-worker uses the SAME image as stockpilot-api (one Python
# binary, two K8s deployments — API mode vs background worker mode).
# All images are pulled from the GAR ghcr-remote mirror at runtime.
#
# Why image SUBSCRIPTIONS are NOT used here:
# The GAR ghcr-remote mirror bumps each image's CREATE_TIME every time
# the cluster re-pulls it, so the *currently-deployed* tag perpetually
# looks "newest" under `imageSelectionStrategy: NewestBuild`. Without a
# fix, autoPromotion regresses prod backwards (we saw this 2026-05-06:
# api -> main-a82935e May 2 + web -> main-cdccb40 May 3 while main HEAD
# was main-63e1bc0). Lexical sort on hex commit SHAs is meaningless;
# SemVer doesn't apply; Digest is alphabetical-by-digest = arbitrary.
#
# What we do INSTEAD:
# Subscribe to the source app repo's main branch (git, not images).
# Kargo's NewestFromBranch strategy uses commit-graph order, not
# registry-cache timestamps, so it is immune to the pull-poisoning bug.
# Each new commit on tesserix/stock-analysis becomes a Freight whose
# commitFrom(...).ID[0:7] is then composed into `main-<sha7>` by the
# prod Stage's promotion template (see ../stages/prod.yaml). The
# images are still pulled from GAR — only the tag derivation source
# changed.
#
# Image push timing: CI builds and pushes `main-<sha7>` to ghcr.io
# (mirrored to GAR) typically within ~5 min of the source commit.
# Kargo's poll interval is 300s, so the worst-case window where Kargo
# promotes a commit before the image is mirrored is one poll cycle —
# pods retry ImagePullBackOff and recover automatically.
apiVersion: kargo.akuity.io/v1alpha1
kind: Warehouse
metadata:
  name: services
spec:
  freightCreationPolicy: Automatic
  interval: 300s
  subscriptions:
    # Authoritative trigger: every new commit on tesserix/stock-analysis
    # main becomes a Freight. Promotion derives image.tag from the
    # commit ID — the GAR mirror's CREATE_TIME is bypassed entirely.
    - git:
        repoURL: https://github.com/tesserix/stock-analysis.git
        branch: main
        commitSelectionStrategy: NewestFromBranch
        discoveryLimit: 20

    # Track tesserix-k8s commits that touch this product's Helm chart
    # / values / ArgoCD Application YAML. Kargo emits a Freight on
    # every matching commit; the Stage's promotion still derives
    # image.tag from the stock-analysis commit (above), so this
    # subscription is purely the audit trail / re-deploy trigger when
    # only chart changes (not app code) have shipped.
    - git:
        repoURL: https://github.com/tesserix/tesserix-k8s.git
        branch: main
        # Mix of regex-style `.*` and explicit literal yaml file paths
        # — see the same comment block in
        # `projects/scrapper/warehouses/services.yaml`. Stockpilot
        # is also nested under ai-apps/ so it needs explicit App paths.
        includePaths:
          - charts/apps/stockpilot-.*
          - argocd/prod/apps/ai-apps/stockpilot-.*
          - argocd/prod/apps/ai-apps/stockpilot-api.yaml
          - argocd/prod/apps/ai-apps/stockpilot-web.yaml
          - argocd/prod/apps/ai-apps/stockpilot-worker.yaml
          - argocd/prod/apps/ai-apps/stockpilot-istio.yaml
          - argocd/prod/apps/ai-apps/stockpilot-postgres.yaml
          - argocd/prod/apps/ai-apps/stockpilot-db-seed.yaml
