---
apiVersion: kargo.akuity.io/v1alpha1
kind: Warehouse
metadata:
  name: services
spec:
  freightCreationPolicy: Automatic
  interval: 300s
  subscriptions:
    # Cloud Build fallback: deploy-<sha7> is added only after authenticated smoke and image scanning pass.
    - image:
        repoURL: asia-south1-docker.pkg.dev/tesseracthub-480811/global/roamie-api
        imageSelectionStrategy: NewestBuild
        allowTagsRegexes:
          - '^deploy-[a-f0-9]{7}$'
        platform: linux/amd64
        strictSemvers: false
        discoveryLimit: 5

    # includePaths are globs unless prefixed with regex:.
    - git:
        repoURL: https://github.com/tesserix/tesserix-k8s.git
        branch: main
        includePaths:
          - regex:^charts/apps/roamie-api/
          - regex:^manifests/roamie-istio/
          - argocd/prod/apps/roamie/roamie-api.yaml
          - argocd/prod/apps/roamie-app-of-apps.yaml
