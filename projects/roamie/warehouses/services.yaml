---
apiVersion: kargo.akuity.io/v1alpha1
kind: Warehouse
metadata:
  name: services
spec:
  freightCreationPolicy: Automatic
  interval: 300s
  subscriptions:
    # Roamie CI adds deploy-<sha7> only after the published image passes its smoke test, then pulls it through the mirror.
    # OCI index with an attestation, so platform picks the amd64 image; Kargo still records the index digest.
    - image:
        repoURL: asia-south1-docker.pkg.dev/tesseracthub-480811/ghcr-remote/tesserix/roamie-api
        imageSelectionStrategy: NewestBuild
        allowTagsRegexes:
          - '^deploy-[a-f0-9]{7}$'
        platform: linux/amd64
        strictSemvers: false
        discoveryLimit: 5

    # includePaths are globs unless prefixed with regex:.
    - git:
        repoURL: https://github.com/tesserix/tesserix-k8s.git
        branch: main
        includePaths:
          - regex:^charts/apps/roamie-api/
          - regex:^manifests/roamie-istio/
          - argocd/prod/apps/roamie/roamie-api.yaml
          - argocd/prod/apps/roamie-app-of-apps.yaml
