---
# Auto-promotes the newest main-<sha7> onto the roamie-api Application (authorized-stage kargo-roamie:prod).
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: prod
  annotations:
    kargo.akuity.io/color: '#0E7C66'
spec:
  requestedFreight:
    - origin:
        kind: Warehouse
        name: services
      sources:
        direct: true
  promotionTemplate:
    spec:
      vars:
        - name: argocdRepo
          value: https://github.com/tesserix/tesserix-k8s.git
        - name: imageTag
          value: main-${{ commitFrom("https://github.com/tesserix/roamie.git").ID[0:7] }}

      steps:
        - uses: argocd-update
          config:
            apps:
              - name: roamie-api
                namespace: argocd
                sources:
                  - repoURL: ${{ vars.argocdRepo }}
                    helm:
                      images:
                        - key: image.tag
                          value: ${{ vars.imageTag }}
