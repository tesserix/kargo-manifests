---
apiVersion: kargo.akuity.io/v1alpha1
kind: Warehouse
metadata:
  name: services
spec:
  freightCreationPolicy: Automatic
  interval: 5m0s
  subscriptions:
    - git:
        repoURL: https://github.com/tesserix/onboarding-service.git
        branch: deploy
        commitSelectionStrategy: NewestFromBranch
        discoveryLimit: 20
