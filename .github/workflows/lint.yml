name: Lint

on:
  push:
    branches: [main]
    paths:
      - "**.yaml"
      - "**.yml"
      - ".github/workflows/lint.yml"
      - ".yamllint.yaml"
  pull_request:
    paths:
      - "**.yaml"
      - "**.yml"
      - ".github/workflows/lint.yml"
      - ".yamllint.yaml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KARGO_VERSION: "1.9.8"
  KUBECONFORM_VERSION: "v0.6.7"

jobs:
  yamllint:
    name: yamllint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run yamllint
        run: |
          pip install --quiet yamllint==1.35.1
          yamllint -c .yamllint.yaml .

  kubeconform:
    name: kubeconform (Kargo + Argo CD CRDs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install kubeconform
        run: |
          curl -fsSL "https://github.com/yannh/kubeconform/releases/download/${{ env.KUBECONFORM_VERSION }}/kubeconform-linux-amd64.tar.gz" \
            | tar -xz -C /tmp
          sudo install -m 0755 /tmp/kubeconform /usr/local/bin/kubeconform
          kubeconform -v

      - name: Cache CRDs
        id: cache-crds
        uses: actions/cache@v4
        with:
          path: .crds
          key: crds-kargo-${{ env.KARGO_VERSION }}-argocd-v2.13.4

      - name: Pull Kargo + Argo CD CRDs
        if: steps.cache-crds.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p .crds .crds/jsonschemas
          # Kargo CRDs — since v1.9 these ship as one file per resource
          # at charts/kargo/resources/crds/kargo.akuity.io_<plural>.yaml
          # rather than the old bundled kargo-crds.yaml. Fetch each one
          # and concatenate.
          KARGO_CRDS_BASE="https://raw.githubusercontent.com/akuity/kargo/v${{ env.KARGO_VERSION }}/charts/kargo/resources/crds"
          : > .crds/kargo-crds.yaml
          for plural in clusterconfigs clusterpromotiontasks freights projectconfigs projects promotions promotiontasks stages warehouses; do
            curl -fsSL "${KARGO_CRDS_BASE}/kargo.akuity.io_${plural}.yaml" >> .crds/kargo-crds.yaml
            printf '\n---\n' >> .crds/kargo-crds.yaml
          done
          # Argo CD CRDs (Application, ApplicationSet, AppProject)
          curl -fsSL "https://raw.githubusercontent.com/argoproj/argo-cd/v2.13.4/manifests/crds/application-crd.yaml" \
            -o .crds/argocd-application-crd.yaml
          curl -fsSL "https://raw.githubusercontent.com/argoproj/argo-cd/v2.13.4/manifests/crds/applicationset-crd.yaml" \
            -o .crds/argocd-applicationset-crd.yaml
          curl -fsSL "https://raw.githubusercontent.com/argoproj/argo-cd/v2.13.4/manifests/crds/appproject-crd.yaml" \
            -o .crds/argocd-appproject-crd.yaml

          # kubeconform consumes JSON Schemas, not raw CRD YAMLs. Convert
          # via the upstream openapi2jsonschema.py (kubeconform's own
          # recommended path). Output filenames use the lower-case
          # `<kind>-<group>-<version>.json` pattern that we plug into
          # the schema-location template below.
          pip install --quiet pyyaml
          curl -fsSL "https://raw.githubusercontent.com/yannh/kubeconform/v0.6.7/scripts/openapi2jsonschema.py" -o /tmp/openapi2jsonschema.py
          chmod +x /tmp/openapi2jsonschema.py
          (
            cd .crds/jsonschemas
            FILENAME_FORMAT='{kind}-{fullgroup}-{version}' python3 /tmp/openapi2jsonschema.py ../kargo-crds.yaml
            FILENAME_FORMAT='{kind}-{fullgroup}-{version}' python3 /tmp/openapi2jsonschema.py ../argocd-application-crd.yaml
            FILENAME_FORMAT='{kind}-{fullgroup}-{version}' python3 /tmp/openapi2jsonschema.py ../argocd-applicationset-crd.yaml
            FILENAME_FORMAT='{kind}-{fullgroup}-{version}' python3 /tmp/openapi2jsonschema.py ../argocd-appproject-crd.yaml
          )
          ls .crds/jsonschemas/ | head -20

      - name: Validate YAML against CRD schemas
        run: |
          set -euo pipefail
          # kubeconform schema-location template. The CRD-derived JSON
          # schemas live under .crds/jsonschemas/<kind>-<group>-<version>.json.
          CRD_SCHEMA='.crds/jsonschemas/{{ .ResourceKind }}-{{ .Group }}-{{ .ResourceAPIVersion }}.json'

          # The kargo-manifests repo has no argocd/ directory of its
          # own — the ApplicationSet that turns this repo into Argo CD
          # Applications lives in tesserix-k8s. Validate everything
          # under projects/ + templates/.
          find projects templates -type f \( -name '*.yaml' -o -name '*.yml' \) -print0 \
            | xargs -0 -r kubeconform \
                -strict \
                -summary \
                -ignore-missing-schemas \
                -schema-location default \
                -schema-location "$CRD_SCHEMA"

  kargo-render:
    name: argocd manifest render dry-run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sanity-check that every projects/<name> directory has a project.yaml
        run: |
          set -euo pipefail
          fail=0
          for d in projects/*/; do
            [ -d "$d" ] || continue
            name=$(basename "$d")
            if [ ! -f "${d}project.yaml" ]; then
              echo "::error file=${d}::missing project.yaml — every project directory must define a Project resource"
              fail=1
            fi
            if [ -d "${d}warehouses" ]; then
              for f in "${d}warehouses"/*.yaml; do
                [ -e "$f" ] || continue
                grep -q "kind: Warehouse" "$f" || {
                  echo "::error file=$f::expected 'kind: Warehouse' in $f"
                  fail=1
                }
              done
            fi
            if [ -d "${d}stages" ]; then
              for f in "${d}stages"/*.yaml; do
                [ -e "$f" ] || continue
                grep -q "kind: Stage" "$f" || {
                  echo "::error file=$f::expected 'kind: Stage' in $f"
                  fail=1
                }
              done
            fi
          done
          exit $fail
